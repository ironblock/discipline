# T1 session one (#301): the Babylon Lite Minecraft-FPS trajectory, driven against the 3.8 floor,
# config r2 of the EXL3 line (#497, approved by the maintainer 2026-10-09). Lines are those ratified
# on #301, each citing its comment; the substrate and the sampler are the 3.8 line's registry entry.
#
# The endpoint, the head, `--worktree` (~/git/experiments/babylon-lite-minecraft-fps) and the
# output cap are `serve`'s command line, not this file. The dev server is started in the
# background by the model's command (#301 5985451013), on loopback port 5180 (the surface keeps 5173).
arm = "t1-session-one"
dogma_version = 0

substrate = "accel24-tabbyapi-exl3-qwen38-27b-3p00"
substrate_reasoning = "on"
substrate_hardware = "e6489f9c1815a0c4540a0c6663acaa3c62b1b66e03806479475c2645347fe7af"

isolation = "sandbox"
network = "host"
sandbox_reads = "all"
# The reference is read-only: no `sandbox_writable` entry, so Seatbelt confines writes to the worktree (the
# maintainer, 2026-10-12; docs/trajectories/t1.md). The receipt's `reference_modified` still checks it.

# T1 runs bash with approvals off (the maintainer, 2026-10-09; #544): every command runs with no
# gate and no prompt, and the log says approvals were off. Seatbelt is unchanged: writes stay
# confined to the worktree.
approval = "none"

# Names only: the values are set by whoever starts `serve`, inside the worktree.
# The chrome-devtools CLI (1.10.1): CD4A_INTERNAL_DAEMON_SESSION_ID selects the run's own daemon,
# started by the operator outside the sandbox; the other two keep the CLI from calling home.
env_passthrough = ["npm_config_cache", "pnpm_config_store_dir", "CD4A_INTERNAL_DAEMON_SESSION_ID", "CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS", "CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS"]

# The run's daemon's socket, filled by the operator per run: its session id (lowercase hex), and
# the operator's uid. A literal path, never a pattern, at most 103 bytes resolved.
# sandbox_unix_sockets = ["/private/tmp/chrome-devtools-mcp-<session id>-<uid>.sock"]

approval_policy = "approvals are off: every command runs without a gate decision or a prompt; Seatbelt confines writes to the worktree"

interview_warrant = ["scoping"]

# T1 runs at xhigh, declared so the record names what was sent (the maintainer, 2026-10-09). The
# format pairs a level with its cap; "none" is its spelling for no cap, and serve sends no budget.
[reasoning]
effort = "xhigh"
budget_tokens = "none"

# The 3.8 line's sampler card, r2's preset qwen38_thinking; all four keys declared, top_k an
# integer, so serve pins every one (#489) and none falls to the engine's untruncated defaults.
[sampler]
temperature = 1.0
top_k = 20
top_p = 0.95
min_p = 0.0
