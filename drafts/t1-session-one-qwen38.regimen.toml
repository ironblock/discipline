# T1 session one (#301): the Babylon Lite Minecraft-FPS trajectory, driven against the 3.8 floor,
# config r2 of the EXL3 line (#497, approved by the maintainer 2026-10-09). Lines are those ratified
# on #301, each citing its comment; the substrate and the sampler are the 3.8 line's registry entry.
#
# The endpoint, the head, `--worktree` (~/git/experiments/babylon-lite-minecraft-fps) and the
# output cap are `serve`'s command line, not this file. The dev server is started in the
# background by the model's command (#301 5985451013), on loopback port 5180 (the surface keeps 5173).
arm = "t1-session-one"
dogma_version = 0

substrate = "accel24-tabbyapi-exl3-qwen38-27b-3p00"
substrate_reasoning = "on"
substrate_hardware = "e6489f9c1815a0c4540a0c6663acaa3c62b1b66e03806479475c2645347fe7af"

isolation = "sandbox"
network = "host"
sandbox_reads = "all"
# The reference is writable like the worktree; the receipt's `reference_modified` covers the whole tree.
sandbox_writable = ["~/git/reference/Babylon"]

# T1 runs bash. The maintainer chose a pre-seeded list over an empty one (2026-10-05).
# Bare `npm` and `pnpm` are left out: serve refuses them as pre-seeds (an npm or pnpm
# approval binds to the script it runs), so `npm install` and the dev server are approved
# once, at workspace scope, when the model first runs them. Declaring the list at all also
# reads the operator's screenshot through the session's confinement (5992900910).
allowed_commands = ["ls", "cat", "rg", "node", "npx", "chrome-devtools"]

# Names only: the values are set by whoever starts `serve`, inside the worktree.
env_passthrough = ["npm_config_cache", "pnpm_config_store_dir"]

approval_policy = "approve any command whose effects stay in the worktree or on loopback; approve network egress for `npm install`, `pnpm install` and the devtools CLI only; deny everything else"

interview_warrant = ["scoping"]

# The 3.8 line's sampler card, r2's preset qwen38_thinking; all four keys declared, top_k an
# integer, so serve pins every one (#489) and none falls to the engine's untruncated defaults.
[sampler]
temperature = 1.0
top_k = 20
top_p = 0.95
min_p = 0.0
