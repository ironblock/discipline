name: pkg-recompute

# A reusable workflow, composed by verify.yml. It runs the checks
# .github/check-owners.tsv says this package owns -- derived, never named
# here, so the table and the workflow cannot drift apart.
#
# SHARDED. `recompute` re-derives every results directory from its own artefacts. At 324 s it is past the 300 s budget on its own, so it is a package of its own, split by directory name (#262).
# The shard count is the table's third column, read here into a matrix: the
# table is the one place the split is declared, and every shard runs the one
# check with VERIFY_CHECK_SHARD=K/N. scripts/check-ci-coverage.py proves the
# shards complete -- every member in exactly one -- and refuses a package
# whose measured seconds per shard pass the budget.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    name: recompute plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.read.outputs.shards }}
      count: ${{ steps.read.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the split this package declares
        id: read
        run: |
          set -euo pipefail
          count="$(awk -F'\t' -v pkg=recompute '!/^#/ && NF>=3 && $2 == pkg { print $3 }' .github/check-owners.tsv)"
          case "$count" in
            ''|*[!0-9]*) echo "::error::recompute declares no shard count in check-owners.tsv"; exit 1 ;;
          esac
          printf 'count=%s\n' "$count" >> "$GITHUB_OUTPUT"
          printf 'shards=[%s]\n' "$(seq -s, 1 "$count")" >> "$GITHUB_OUTPUT"

  checks:
    name: recompute ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5

      - name: Run the checks this package owns, one shard
        env:
          VERIFY_CHECK_SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.count }}
          VERIFY_MEMBERS_RAN: ${{ runner.temp }}/members-ran.tsv
        run: |
          set -euo pipefail
          mapfile -t checks < <(
            awk -F'\t' -v pkg=recompute '!/^#/ && NF>=2 && $2 == pkg { print $1 }' \
              .github/check-owners.tsv
          )
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "::error::no check is owned by 'recompute'; a workflow that runs nothing is not a pass"
            exit 1
          fi
          args=()
          for check in "${checks[@]}"; do args+=(--only "$check"); done
          printf 'checks owned by recompute: %s, shard %s\n' "${checks[*]}" "$VERIFY_CHECK_SHARD"
          ./verify.sh "${args[@]}"

      # WHAT THIS SHARD RAN, for the gate's census (#262, ruled on #268): the
      # members its run loop reached, as it reached them. A listing says what a
      # shard would run; this says what it did.
      - uses: actions/upload-artifact@v4
        with:
          name: members-recompute-${{ matrix.shard }}
          path: ${{ runner.temp }}/members-ran.tsv
          if-no-files-found: error
