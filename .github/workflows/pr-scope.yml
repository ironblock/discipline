name: pr-scope

# THE CHORE LANE'S VERDICT, as a line on every pull request (#276). It prints
# what `scripts/pr-scope.py` makes of the diff -- `material` or `chore`, why,
# and the checks the diff touches -- as a notice on the run and in its
# summary. It gates nothing: CI runs every check on every pull request
# whatever this says, and the lane changes only what an author owes locally
# and on the thread. So it is not called from verify.yml, and the gate does
# not wait on it.

on:
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    name: pr-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify the diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          verdict="$(python3 scripts/pr-scope.py --base "origin/${BASE}" --head HEAD)"
          # Every line prefixed, so a path name carrying a newline cannot
          # start a line the runner reads as a workflow command (#280's
          # second review). pr-scope.py writes a path's control characters
          # as `\xNN`, since a lone CR also ends a line for the runner, and
          # the notice's data is escaped as workflow commands require: `%`,
          # CR and LF (#280's fifth review).
          printf '%s\n' "$verdict" | sed 's/^/pr-scope: /'
          notice="$(printf '%s' "$verdict" | paste -sd ';' -)"
          pct='%' cr=$'\r' lf=$'\n' pct_e='%25' cr_e='%0D' lf_e='%0A'
          notice="${notice//"$pct"/$pct_e}"
          notice="${notice//"$cr"/$cr_e}"
          notice="${notice//"$lf"/$lf_e}"
          printf '::notice title=pr-scope::%s\n' "$notice"
          {
            echo '### pr-scope'
            echo
            echo '<pre>'
            printf '%s\n' "$verdict" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"
