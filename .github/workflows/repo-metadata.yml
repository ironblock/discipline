name: repo-metadata

on:
  push:
    # A `branches:` list cannot take an expression: exactly .github/branches.tsv's
    # two branches, checked by check-ci-coverage.py (#326). The job below runs
    # only for the default branch, so a release push does not re-sync.
    branches: [main, develop]
    paths:
      - .github/labels.json
      - .github/milestones.json
      - .github/workflows/repo-metadata.yml
      - scripts/sync-repo-metadata.sh
      - scripts/check-repo-metadata.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repo-metadata
  cancel-in-progress: false

jobs:
  sync:
    name: labels and milestones
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Validate before applying: a malformed definition must not reach the API.
      - name: Validate the definitions
        run: python3 scripts/check-repo-metadata.py

      - name: Reconcile
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/sync-repo-metadata.sh
