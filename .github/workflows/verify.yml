name: verify

# The root gate. It composes one reusable workflow per package and one for the
# gate's own selftest, then requires every one of them to have SUCCEEDED --
# not merely to have avoided failing.
#
# There is deliberately no `paths:` filter anywhere here. A skipped job is not
# a failed job: `!failure()` and `!cancelled()` both pass on skipped, and a
# whole workflow filtered out by path leaves its required check pending
# forever. scripts/check-ci-coverage.py enforces that mechanically, so this
# comment is a description rather than a promise.

on:
  # `push` is scoped to the integration and release branches, and nothing
  # else is. On a branch with a pull request open, `push` and `pull_request`
  # fire on the SAME sha and GitHub keys the concurrency group per event, so
  # both ran to completion -- the whole gate, twice, for one commit. Scoping
  # push to the two named branches leaves each sha with exactly one run: the
  # pull-request run while it is a branch, the push run once it is history.
  #
  # This is a branch filter, not a path filter, and the difference is what
  # makes it safe: no check is skipped for any sha that a pull request covers.
  # The cost it does have is real and worth stating -- a branch pushed with no
  # pull request open gets no run at all. `pull_request` carries no `branches:`
  # for the same reason: a filter there would leave pull requests targeting
  # anything but the named branch ungated, which is the failure this comment
  # is about. check-ci-coverage.py refuses one.
  #
  # A `branches:` list cannot take an expression, so the two names are
  # spelled here: they must be exactly .github/branches.tsv's
  # `integration_branch` and `release_branch`, which check-ci-coverage.py
  # checks (#326). Both are listed so the rename can happen in either order.
  push:
    branches: [main, develop]
  pull_request:
  # THE NIGHTLY (#112). A pull request re-proves only the faults its diff can
  # reach, and inherits the rest from the base branch's last full run; an indirect
  # dependency -- a helper, the runner image, the toolchain's own drift -- is
  # what this catches, within a day. It runs the full set on the default
  # branch, like a push to it, and a fault it finds not red opens an issue.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

# SUPERSEDING, EXCEPT ON THE WAY INTO THE RELEASE BRANCH (#326). A pull
# request's newer push supersedes its older run. A push to the integration
# branch supersedes the one in flight too: merges never queue behind a full
# run (on 2026-10-03 one waited 60 minutes, run 37097117869), and the census
# pull requests are scoped against is the last run that COMPLETED, which a
# cancelled run is not. A release pull request and a push to the release
# branch are never cancelled: the release branch is green by construction,
# and every run on the way into it finishes.
#
# 'main' below is .github/branches.tsv's `release_branch`. A concurrency
# expression reads no file, so it is spelled here, once, and
# check-ci-coverage.py checks this expression against that row (#326, Q1).
# A pull request into the release branch BEFORE the rename, while it is still
# the default branch, is an ordinary pull request and supersedes; so is one
# into any other branch, a stacked pull request's base.
#
# The event is in the key so the nightly has a group of its own: on the same
# ref as a push, it would otherwise be cancelled by a merge or cancel one.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && (github.base_ref != 'main' || github.base_ref == github.event.repository.default_branch)) || (github.event_name == 'push' && github.ref_name != 'main') }}

jobs:
  diet:
    uses: ./.github/workflows/pkg-diet.yml

  exercise:
    uses: ./.github/workflows/pkg-exercise.yml

  repo:
    uses: ./.github/workflows/pkg-repo.yml

  bsd:
    uses: ./.github/workflows/pkg-bsd.yml

  injections:
    uses: ./.github/workflows/pkg-injections.yml

  recompute:
    uses: ./.github/workflows/pkg-recompute.yml

  selftest:
    uses: ./.github/workflows/gate-selftest.yml
    # `actions: read` for the scope plan's base-branch censuses, `issues: read` for
    # the drift issues a pull request is refused on (#112).
    permissions:
      contents: read
      actions: read
      issues: read

  gate:
    name: gate
    needs: [diet, exercise, repo, bsd, injections, recompute, selftest]
    if: always()
    runs-on: ubuntu-latest
    # `actions: read` on top of the workflow's `contents: read`, because this
    # job downloads the shards' census artifacts and the workflow-level grant
    # is a ceiling, not a floor: without it the token cannot read this run's
    # own artifacts and the census step fails for a reason that has nothing to
    # do with the shards.
    permissions:
      contents: read
      actions: read
      # To open a drift issue on a push or the nightly (#112). Pull-request
      # runs never reach the step that uses it.
      issues: write
    steps:
      - uses: actions/checkout@v5

      # A FAULT NOT SEEN RED ON A FULL RUN OPENS AN ISSUE AGAINST ITS CHECK
      # (#112). Before the verdict below, which stops the job when a shard
      # failed -- and a failed shard is exactly when there is something to
      # open. The build's verdict is unchanged by it: the run is still red.
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          pattern: selftest-not-red-*
          path: ${{ runner.temp }}/not-red
      - name: Open an issue for each fault not seen red
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/selftest-drift.py open "${{ runner.temp }}/not-red"

      # The comparison lives in a script rather than inline here, so that it
      # can be run and proven against every result state instead of being
      # trusted because it looks right in YAML.
      # `always()`: the opener above only fails when a shard already has, and
      # its failure must not hide this step's message about which job it was.
      - name: Every job must have succeeded
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check-job-results.py

      # Only reached when the step above passed, because `run` steps stop at
      # the first failure. So the census is asked its question -- did the
      # shards between them run every fault -- of a set of shards that all
      # succeeded. Two different claims, in the order that makes each one
      # answerable: every shard went green, and every fault was in a shard.
      #
      # It lives here rather than in a job of its own inside gate-selftest.yml
      # because this job is the one check-ci-coverage.py already proves is
      # depended upon. A new job there would be a job nothing checks is
      # reachable, and a skipped one would leave the called workflow green.
      - uses: actions/download-artifact@v4
        with:
          pattern: selftest-census-*
          path: ${{ runner.temp }}/census

      - name: Every fault was run by exactly one shard
        run: python3 scripts/check-selftest-census.py "${{ runner.temp }}/census"

      # The same question of the sharded packages (#262, ruled on #268): did
      # their shards, between them, RUN every member of their check exactly
      # once -- read from what each shard's run loop recorded, never from a
      # listing, against the unsplit listing verify.sh gives here.
      - uses: actions/download-artifact@v4
        with:
          pattern: members-*
          path: ${{ runner.temp }}/members

      - name: Every sharded member was run by exactly one shard
        run: python3 scripts/check-shard-census.py "${{ runner.temp }}/members"
