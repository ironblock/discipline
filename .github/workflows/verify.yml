name: verify

# The root gate: one reusable workflow per package, and a `gate` job that
# passes only when every one of them SUCCEEDED -- not merely avoided failing.
# What each package runs is `.github/check-owners.tsv`; what a check is, is
# `verify.sh`. Conventional checks only since #506: the seeded-fault selftest
# and the machinery around it left CI.
#
# No `paths:` filter: a skipped job is not a failed job, and a workflow
# filtered out by path leaves a required check pending forever.

on:
  # `push` only to the integration and release branches: on a branch with a
  # pull request open, `push` and `pull_request` fire on the same sha, and the
  # whole gate would run twice. A branch pushed with no pull request open gets
  # no run.
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# A newer push supersedes the run in flight, except on the way into the
# release branch, where every run finishes.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && (github.base_ref != 'main' || github.base_ref == github.event.repository.default_branch)) || (github.event_name == 'push' && github.ref_name != 'main') }}

jobs:
  diet:
    uses: ./.github/workflows/pkg-diet.yml

  exercise:
    uses: ./.github/workflows/pkg-exercise.yml

  repo:
    uses: ./.github/workflows/pkg-repo.yml

  gate:
    name: gate
    needs: [diet, exercise, repo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # A skipped or cancelled job is not a pass: every one must be `success`.
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::a job the gate needs ended '$result'"
              exit 1
            fi
          done
