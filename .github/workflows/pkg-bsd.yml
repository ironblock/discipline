name: pkg-bsd

# A reusable workflow, composed by verify.yml. It runs the checks
# .github/check-owners.tsv says this package owns -- derived, never named
# here, so the table and the workflow cannot drift apart.
#
# SHARDED. `bsd` applies every injection again under the BSD-shaped sed (#75): 443 s on its own, past the 300 s budget. Split by injection name, the whole population kept (#260, #262).
# The shard count is the table's third column, spelled here as the matrix
# because a matrix needs its list before any job starts (#352): the table is
# the one place the split is declared, scripts/check-ci-coverage.py refuses a
# list that is not exactly 1..N for it, and every shard runs the one check
# with VERIFY_CHECK_SHARD=K/N, N being the matrix's own size. scripts/check-ci-coverage.py proves the
# shards complete -- every member in exactly one -- and refuses a package
# whose measured seconds per shard pass the budget.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: bsd ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      - name: Run the checks this package owns, one shard
        env:
          VERIFY_CHECK_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          VERIFY_MEMBERS_RAN: ${{ runner.temp }}/members-ran.tsv
        run: |
          set -euo pipefail
          mapfile -t checks < <(
            awk -F'\t' -v pkg=bsd '!/^#/ && NF>=2 && $2 == pkg { print $1 }' \
              .github/check-owners.tsv
          )
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "::error::no check is owned by 'bsd'; a workflow that runs nothing is not a pass"
            exit 1
          fi
          args=()
          for check in "${checks[@]}"; do args+=(--only "$check"); done
          printf 'checks owned by bsd: %s, shard %s\n' "${checks[*]}" "$VERIFY_CHECK_SHARD"
          ./verify.sh "${args[@]}"

      # WHAT THIS SHARD RAN, for the gate's census (#262, ruled on #268): the
      # members its run loop finished, each with the outcome its work returned.
      # A listing says what a shard would run; this says what it did.
      - uses: actions/upload-artifact@v4
        with:
          name: members-bsd-${{ matrix.shard }}
          path: ${{ runner.temp }}/members-ran.tsv
          if-no-files-found: error
