name: pkg-bsd

# A reusable workflow, composed by verify.yml. It runs the checks
# .github/check-owners.tsv says this package owns -- derived, never named
# here, so the table and the workflow cannot drift apart.
#
# Its own job, not the repo job's (#260, ruled 2026-10-02): `bsd` applies
# every injection again under the BSD-shaped sed, as long as `injections`
# takes, and the two in one job are past the 300 s wall-clock budget. Run
# beside the repo job, it spends runner-minutes, which are unbilled here,
# rather than wall clock. The whole population is applied: running only the
# injections that call `edit_in_place` would miss a body that assembles
# `sed`'s name itself, which is the residue this check exists to close.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: bsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run the checks this package owns
        run: |
          set -euo pipefail
          mapfile -t checks < <(
            awk -F'\t' -v pkg=bsd '!/^#/ && NF>=2 && $2 == pkg { print $1 }' \
              .github/check-owners.tsv
          )
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "::error::no check is owned by 'bsd'; a workflow that runs nothing is not a pass"
            exit 1
          fi
          args=()
          for check in "${checks[@]}"; do args+=(--only "$check"); done
          printf 'checks owned by bsd: %s\n' "${checks[*]}"
          ./verify.sh "${args[@]}"
