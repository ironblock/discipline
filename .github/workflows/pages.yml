name: pages

# Publishes the static placeholder through the Pages *Actions* pipeline, which
# is how this repository's Pages is configured -- there is no gh-pages branch
# to push to, and pushing one would leave a branch GitHub ignores while the
# deploy reported success.
#
# Static only. Nothing here reaches a network, a model, or a secret; the
# id-token permission exists so deploy-pages can prove to Pages that this
# workflow produced the artifact, not to reach anything.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Publishing must not be able to route around the gate. Without this the
      # site could serve a surface `./verify.sh --only pages` rejects.
      - name: Gate the surface
        run: ./verify.sh --only pages

      - uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          cp -r pages _site
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
