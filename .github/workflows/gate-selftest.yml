name: gate-selftest

# The gate's own test, composed by verify.yml. Every line of its output must
# read RED: a gate that has never been seen red is not a gate.
#
# Sharded, because the fault list is long -- `check-fault-manifest.py
# --count-selftest-red` says how long, and is the one reader that knows -- and
# most of it rebuilds the crate in a sandbox. This line used to carry the
# number itself and was two short from the commit that wrote it.
#
# Sharding is a division of labour and NOT a selection of
# faults: `--shard K/N` decides which job runs a fault, never whether it runs.
# The two are told apart after the fact -- each shard writes down the ordinals
# it ran, and verify.yml's gate job adds them up and refuses unless they are
# exactly the manifest's list, each fault once. A shard that quietly ran
# nothing exits 0 and reports `success` like any other; the census is the only
# thing that can tell you it did.
#
# N is `strategy.job-total`, so the matrix below is the one place the shard
# count is written. Change the list and the flag follows.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  selftest:
    name: selftest ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs. `fail-fast` would cancel the others on the first
      # red, and a cancelled shard files no census -- so a real failure would
      # arrive alongside a census failure blaming the shards it cancelled.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the pinned toolchain
        run: cargo --version

      # The isolation lane's seeded faults need a sandbox to execute
      # against, same as `pkg-diet.yml`'s own copy of these three steps --
      # without `bwrap` the lane asserts a correct REFUSAL and passes, which
      # is exactly what let `lane: isolation.isolation.the-escape-census-
      # under-reports` fire GREEN here rather than RED (#83): #76's applier
      # is what wires lane faults into `--selftest` at all, so this gap was
      # unreachable before it and is this PR's to close. Every shard gets
      # it, not just whichever one draws an isolation fault -- sharding is a
      # division of labour, never a selection, per this file's own header,
      # so which shard that lands on is not something to predict.
      - name: Install the sandbox the isolation lane confines with
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # THE ONE RELAXED CONTROL, NAMED, per `pkg-diet.yml` and its ruling on
      # #74: Ubuntu 24.04 refuses unprivileged user namespaces, which is
      # what `bwrap` builds every sandbox out of, so without this no
      # composition starts and the isolation lane's seeded escapes cannot
      # execute here either. Tolerant rather than fatal: if the sysctl
      # cannot be set, the honest signal is the isolation tests failing
      # with their own message about the mechanism, not this step erroring
      # first and hiding it.
      - name: Permit the user namespaces the sandbox is built from
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "::warning::the userns restriction could not be relaxed; the isolation tests will say so"

      # And say so, which is what makes the refusal branch a failure HERE
      # and nowhere a contributor's own machine lacks `bwrap`.
      - name: Declare this a host where the sandbox is required
        run: echo "DIET_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"

      - name: ./verify.sh --selftest --shard ${{ matrix.shard }}
        run: >-
          ./verify.sh --selftest
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --census "${{ runner.temp }}/census.tsv"

      # Uploaded only on success, deliberately. A shard that failed has
      # already failed the build; its census would say nothing the failure
      # does not, and the aggregate reporting "shard 5 filed no census" is a
      # true statement about a shard that did not finish.
      - name: Keep this shard's census
        uses: actions/upload-artifact@v4
        with:
          name: selftest-census-${{ matrix.shard }}
          path: ${{ runner.temp }}/census.tsv
          if-no-files-found: error
          retention-days: 7
