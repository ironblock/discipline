name: gate-selftest

# The gate's own test, composed by verify.yml. Every line of its output must
# read RED: a gate that has never been seen red is not a gate.
#
# Sharded, because the fault list is long and most of it rebuilds the crate in
# a sandbox. Sharding is a division of labour and NOT a selection of faults:
# `--shard K/N` decides which job runs a fault -- by a hash of its id -- never
# whether it runs. The two are told apart after the fact: each shard writes
# down the ordinals it ran, and verify.yml's gate job adds them up and refuses
# unless they are exactly the manifest's list, each fault once. A shard that
# quietly ran nothing exits 0 and reports `success` like any other; the census
# is the only thing that can tell you it did.
#
# HOW MANY SHARDS IS NOT WRITTEN HERE (#87). It is derived by
# scripts/scope-selftest.py --matrix, by the run's KIND (#326): a release
# pull request, a push to the release branch and the nightly get
# .github/gate-budget.tsv's `max_shards`; a push to the integration branch,
# which the next push supersedes, gets `develop_shards`; and a pull request
# re-proving a fraction of the faults gets that fraction of `max_shards`,
# never fewer than one (#112). The harvested plan that balanced shards by measured cost retired
# with that ruling; the budget is a number every run prints, not a gate.
#
# N is `strategy.job-total`, the size of the matrix the plan produced, so the
# flag follows the derivation with nothing restating it.

on:
  workflow_call:

permissions:
  contents: read
  # To read the base branch's latest full run's census artifacts, which a
  # pull request's scope plan is derived from (#112).
  actions: read
  # To ask whether a check this pull request re-proves has an open drift issue
  # from a full run (#112).
  issues: read

jobs:
  # One short job, so that the matrix below can be a number this repository
  # derived rather than a number somebody typed. `fromJson` needs a JSON array
  # and a matrix needs it before any shard starts, which is what makes this a
  # job of its own rather than a step.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.count.outputs.shards }}
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - uses: actions/checkout@v5

      # WHAT KIND OF RUN THIS IS (#326), read from the event and the branch
      # table, never from a branch spelled here: `scoped` (a pull request into
      # anything but the release branch), `superseding` (a push to the
      # integration branch, the repository's default) or `full` (a release
      # pull request, a push to the release branch, the nightly). Bound to a
      # variable first, for the reason the count step below gives.
      - name: What kind of run this is
        id: kind
        run: |
          kind="$(python3 scripts/scope-selftest.py --kind \
            --event "${{ github.event_name }}" --ref "${{ github.ref_name }}" \
            --base-ref "${{ github.base_ref }}" \
            --default-branch "${{ github.event.repository.default_branch }}")"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"

      # A PULL REQUEST RE-PROVES ONLY WHAT ITS DIFF CAN REACH (#112). The
      # base branch's latest successful full run -- a push or the nightly, the
      # newer; a superseded push run was cancelled and has no census (#326) --
      # says which faults ran red there, at which commit, and which files each
      # fault's injection touched; scripts/scope-selftest.py turns that and
      # this diff into a plan of faults to INHERIT, each declared in this
      # run's census at the commit it was last seen red -- never counted as
      # passed. No census, or none this branch can reach, is a plan that
      # inherits nothing, and every fault runs. A push is never scoped, and
      # neither is a release pull request: both are full runs.
      - name: Fetch the history the scope is measured against
        if: steps.kind.outputs.kind == 'scoped'
        run: git fetch --no-tags --quiet origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --unshallow || git fetch --no-tags --quiet origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Read the base branch's latest full run's censuses
        if: steps.kind.outputs.kind == 'scoped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ runner.temp }}/base-census"
          run_id="$(gh run list --repo "${{ github.repository }}" --workflow verify.yml \
            --branch "${{ github.base_ref }}" --status success --limit 50 \
            --json databaseId,event \
            --jq '[.[] | select(.event == "push" or .event == "schedule")][0].databaseId // empty')"
          if [ -n "$run_id" ]; then
            echo "the census is verify run ${run_id}, the newest successful push or nightly on ${{ github.base_ref }}"
            gh run download "$run_id" --repo "${{ github.repository }}" \
              --pattern 'selftest-census-*' --dir "${{ runner.temp }}/base-census" \
              || echo "::warning::run ${run_id} on ${{ github.base_ref }} has no census to read; every fault runs"
          else
            echo "::warning::no successful full run on ${{ github.base_ref }} to read; every fault runs"
          fi
      - name: Derive this pull request's scope plan
        if: steps.kind.outputs.kind == 'scoped'
        run: >-
          python3 scripts/scope-selftest.py
          --base "origin/${{ github.base_ref }}"
          --census "${{ runner.temp }}/base-census"
          --out "${{ runner.temp }}/scope-plan.tsv"
          --checks-out "${{ runner.temp }}/checks.txt"

      # A FAULT FOUND NOT RED ON A FULL RUN BLOCKS THE NEXT PULL REQUEST THAT
      # TOUCHES ITS CHECK (#112, ruled 2026-09-27). Every full run that is not
      # a pull request's -- a push to either branch, the nightly -- opens an
      # issue labelled `check:<name>` for each such fault; this refuses while
      # one is open for any check whose faults this pull request re-proves,
      # and names it. Before any shard starts, so the refusal is the first
      # thing the run says. A release pull request re-proves every check, so
      # it is refused while ANY drift issue is open (#326, Q4): the release
      # branch is green by construction.
      - name: Every check, for a release pull request
        if: steps.kind.outputs.kind == 'full' && github.event_name == 'pull_request'
        run: python3 scripts/scope-selftest.py --list-checks > "${{ runner.temp }}/checks.txt"
      - name: No open drift issue against a check this pull request re-proves
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/selftest-drift.py block "${{ runner.temp }}/checks.txt"
      - name: Keep the scope plan
        if: steps.kind.outputs.kind == 'scoped'
        uses: actions/upload-artifact@v4
        with:
          name: selftest-scope-plan
          path: ${{ runner.temp }}/scope-plan.tsv
          if-no-files-found: error
          retention-days: 7

      # After the scope, because the count is the scope's: the full list on a
      # full or superseding run, what the plan does not inherit on a scoped
      # one, divided by the ceiling the kind names.
      #
      # The substitution is BOUND TO A VARIABLE FIRST, not written straight
      # into the `echo`. `echo "shards=$(...)" >> $GITHUB_OUTPUT` is echo's
      # exit status, which is 0 whatever the script did -- so a refusal would
      # set an empty output, and the failure would arrive later as an
      # unreadable matrix expression rather than here as the script's own
      # message. An assignment carries the substitution's status, and the
      # default shell is `bash -e`.
      - name: How many shards this run needs
        id: count
        run: |
          shards="$(python3 scripts/scope-selftest.py --matrix --kind "${{ steps.kind.outputs.kind }}" \
            ${{ steps.kind.outputs.kind == 'scoped' && format('--plan {0}/scope-plan.tsv', runner.temp) || '' }})"
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"
          echo "this run derives ${shards}"

  selftest:
    name: selftest ${{ matrix.shard }}
    needs: [plan]
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs. `fail-fast` would cancel the others on the first
      # red, and a cancelled shard files no census -- so a real failure would
      # arrive alongside a census failure blaming the shards it cancelled.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the pinned toolchain
        run: cargo --version

      # A CARGO CACHE WHERE THE FAULTS BUILD (#306). Every sandbox builds into
      # one target, VERIFY_SELFTEST_TARGET below, and this restores into that
      # directory -- not the checkout's target/, which no fault builds in. Keyed
      # on Cargo.lock, rust-toolchain.toml and rustc (the action's own key)
      # and the runner image, which rides in `shared-key`: with `shared-key`
      # set the action ignores `key` (#309's review). The workspace's crates
      # rebuild in every box regardless, and the action drops them before
      # saving. Shard 1 saves, and only it: the others would race to write
      # the same key.
      - name: Name the runner image for the cache key
        run: echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"
      - name: Restore the Cargo cache the sandboxes build into
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/selftest"
          shared-key: selftest-${{ env.RUNNER_IMAGE }}
          save-if: ${{ matrix.shard == 1 }}

      # The isolation lane's seeded faults need a sandbox to execute
      # against, same as `pkg-diet.yml`'s own copy of these three steps --
      # without `bwrap` the lane asserts a correct REFUSAL and passes, which
      # is exactly what let `lane: isolation.isolation.the-escape-census-
      # under-reports` fire GREEN here rather than RED (#83): #76's applier
      # is what wires lane faults into `--selftest` at all, so this gap was
      # unreachable before it and is this PR's to close. Every shard gets
      # it, not just whichever one draws an isolation fault -- sharding is a
      # division of labour, never a selection, per this file's own header,
      # so which shard that lands on is not something to predict.
      # BOUNDED, because a hung package mirror is not a test result: on
      # 2026-10-01 four selftest shards sat in `apt-get update` at the archive
      # fetch until GitHub's six-hour job limit cancelled them (#222's run
      # 36884660921). Measured over 1,050 runs of this step in the 60 latest
      # successful verify runs (#232's review): median 11 s, p95 24 s, p99
      # 54 s, max 100 s, the tail all inside that incident's window. Five
      # minutes is three times the slowest seen: a step this slow has hung.
      - name: Install the sandbox the isolation lane confines with
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # THE ONE RELAXED CONTROL, NAMED, per `pkg-diet.yml` and its ruling on
      # #74: Ubuntu 24.04 refuses unprivileged user namespaces, which is
      # what `bwrap` builds every sandbox out of, so without this no
      # composition starts and the isolation lane's seeded escapes cannot
      # execute here either. Tolerant rather than fatal: if the sysctl
      # cannot be set, the honest signal is the isolation tests failing
      # with their own message about the mechanism, not this step erroring
      # first and hiding it.
      - name: Permit the user namespaces the sandbox is built from
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "::warning::the userns restriction could not be relaxed; the isolation tests will say so"

      # And say so, which is what makes the refusal branch a failure HERE
      # and nowhere a contributor's own machine lacks `bwrap`.
      - name: Declare this a host where the sandbox is required
        run: echo "DIET_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"

      # The web surface's seeded faults run `verify.sh --only exercise` in a
      # sandbox, which installs its dependencies and typechecks: it needs Node,
      # and runs the pnpm exercise/package.json pins through npx (#194). The
      # host pnpm here serves only setup-node's pnpm cache. Every shard
      # gets them, for the reason every shard gets bubblewrap above. These
      # are steps around the selftest, so .github/gate-budget.tsv's
      # `runner_overhead_seconds` is due a re-measure on the first run that
      # has them.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: exercise/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: exercise/pnpm-lock.yaml

      - name: The scope plan this pull request's plan job derived
        if: needs.plan.outputs.kind == 'scoped'
        uses: actions/download-artifact@v4
        with:
          name: selftest-scope-plan
          path: ${{ runner.temp }}

      - name: ./verify.sh --selftest --shard ${{ matrix.shard }}
        env:
          VERIFY_SELFTEST_TARGET: ${{ github.workspace }}/target/selftest
        run: >-
          ./verify.sh --selftest
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --census "${{ runner.temp }}/census.tsv"
          ${{ needs.plan.outputs.kind == 'scoped' && format('--scope-plan {0}/scope-plan.tsv', runner.temp) || '' }}

      # Uploaded only on success, deliberately. A shard that failed has
      # already failed the build; its census would say nothing the failure
      # does not, and the aggregate reporting "shard 5 filed no census" is a
      # true statement about a shard that did not finish.
      - name: Keep this shard's census
        uses: actions/upload-artifact@v4
        with:
          name: selftest-census-${{ matrix.shard }}
          path: ${{ runner.temp }}/census.tsv
          if-no-files-found: error
          retention-days: 7

      # ...and on a push or the nightly, a shard that FAILED keeps its census
      # under another name, because its `not_red` rows are what
      # scripts/selftest-drift.py opens issues from (#112). Not under
      # `selftest-census-*`: the gate's census check reads that pattern, and a
      # failed shard's partial census is not a part of a whole. `ignore`,
      # because a shard that failed before the census was written has nothing
      # to keep, and its failure is already the build's.
      - name: Keep a failed shard's census for the drift issues
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: selftest-not-red-${{ matrix.shard }}
          path: ${{ runner.temp }}/census.tsv
          if-no-files-found: ignore
          retention-days: 7
