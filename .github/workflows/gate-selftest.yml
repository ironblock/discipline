name: gate-selftest

# The gate's own test, composed by verify.yml. Every line of its output must
# read RED: a gate that has never been seen red is not a gate.
#
# Sharded, because the fault list is long and most of it rebuilds the crate in
# a sandbox. Sharding is a division of labour and NOT a selection of faults:
# `--shard K/N` decides which job runs a fault -- by a hash of its id -- never
# whether it runs. The two are told apart after the fact: each shard writes
# down the ordinals it ran, and verify.yml's gate job adds them up and refuses
# unless they are exactly the manifest's list, each fault once. A shard that
# quietly ran nothing exits 0 and reports `success` like any other; the census
# is the only thing that can tell you it did.
#
# HOW MANY SHARDS IS NOT WRITTEN HERE (#87). It is derived by
# scripts/scope-selftest.py --matrix: the full run on `main` and the nightly
# get .github/gate-budget.tsv's `max_shards`, and a pull request re-proving a
# fraction of the faults gets that fraction of it, never fewer than one
# (#112). The harvested plan that balanced shards by measured cost retired
# with that ruling; the budget is a number every run prints, not a gate.
#
# N is `strategy.job-total`, the size of the matrix the plan produced, so the
# flag follows the derivation with nothing restating it.

on:
  workflow_call:

permissions:
  contents: read
  # To read the latest `main` run's census artifacts, which a pull request's
  # scope plan is derived from (#112).
  actions: read
  # To ask whether a check this pull request re-proves has an open drift issue
  # on `main` (#112).
  issues: read

jobs:
  # One short job, so that the matrix below can be a number this repository
  # derived rather than a number somebody typed. `fromJson` needs a JSON array
  # and a matrix needs it before any shard starts, which is what makes this a
  # job of its own rather than a step.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.count.outputs.shards }}
    steps:
      - uses: actions/checkout@v5

      # A PULL REQUEST RE-PROVES ONLY WHAT ITS DIFF CAN REACH (#112). The
      # latest successful `main` run's censuses say which faults ran red there,
      # at which commit, and which files each fault's injection touched;
      # scripts/scope-selftest.py turns that and this diff into a plan of
      # faults to INHERIT, each declared in this run's census at the commit it
      # was last seen red -- never counted as passed. No `main` census, or
      # none this branch can reach, is a plan that inherits nothing, and every
      # fault runs. A push to `main` is never scoped: it is the full run the
      # next pull request's plan is read from.
      - name: Fetch the history the scope is measured against
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --quiet origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --unshallow || git fetch --no-tags --quiet origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Read the latest main run's censuses
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ runner.temp }}/main-census"
          run_id="$(gh run list --repo "${{ github.repository }}" --workflow verify.yml \
            --branch "${{ github.base_ref }}" --event push --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "${{ github.repository }}" \
              --pattern 'selftest-census-*' --dir "${{ runner.temp }}/main-census" \
              || echo "::warning::main run ${run_id} has no census to read; every fault runs"
          else
            echo "::warning::no successful main run to read; every fault runs"
          fi
      - name: Derive this pull request's scope plan
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/scope-selftest.py
          --base "origin/${{ github.base_ref }}"
          --census "${{ runner.temp }}/main-census"
          --out "${{ runner.temp }}/scope-plan.tsv"
          --checks-out "${{ runner.temp }}/checks.txt"

      # A FAULT FOUND NOT RED ON `main` BLOCKS THE NEXT PULL REQUEST THAT
      # TOUCHES ITS CHECK (#112, ruled 2026-09-27). The `main` run and the
      # nightly open an issue labelled `check:<name>` for each such fault;
      # this refuses while one is open for any check whose faults this pull
      # request re-proves, and names it. Before any shard starts, so the
      # refusal is the first thing the run says.
      - name: No open drift issue against a check this pull request re-proves
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/selftest-drift.py block "${{ runner.temp }}/checks.txt"
      - name: Keep the scope plan
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: selftest-scope-plan
          path: ${{ runner.temp }}/scope-plan.tsv
          if-no-files-found: error
          retention-days: 7

      # After the scope, because the count is the scope's: the full list on a
      # push or the nightly, what the plan does not inherit on a pull request.
      #
      # The substitution is BOUND TO A VARIABLE FIRST, not written straight
      # into the `echo`. `echo "shards=$(...)" >> $GITHUB_OUTPUT` is echo's
      # exit status, which is 0 whatever the script did -- so a refusal would
      # set an empty output, and the failure would arrive later as an
      # unreadable matrix expression rather than here as the script's own
      # message. An assignment carries the substitution's status, and the
      # default shell is `bash -e`.
      - name: How many shards this run needs
        id: count
        run: |
          shards="$(python3 scripts/scope-selftest.py --matrix \
            ${{ github.event_name == 'pull_request' && format('--plan {0}/scope-plan.tsv', runner.temp) || '' }})"
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"
          echo "this run derives ${shards}"

  selftest:
    name: selftest ${{ matrix.shard }}
    needs: [plan]
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs. `fail-fast` would cancel the others on the first
      # red, and a cancelled shard files no census -- so a real failure would
      # arrive alongside a census failure blaming the shards it cancelled.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the pinned toolchain
        run: cargo --version

      # The isolation lane's seeded faults need a sandbox to execute
      # against, same as `pkg-diet.yml`'s own copy of these three steps --
      # without `bwrap` the lane asserts a correct REFUSAL and passes, which
      # is exactly what let `lane: isolation.isolation.the-escape-census-
      # under-reports` fire GREEN here rather than RED (#83): #76's applier
      # is what wires lane faults into `--selftest` at all, so this gap was
      # unreachable before it and is this PR's to close. Every shard gets
      # it, not just whichever one draws an isolation fault -- sharding is a
      # division of labour, never a selection, per this file's own header,
      # so which shard that lands on is not something to predict.
      - name: Install the sandbox the isolation lane confines with
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # THE ONE RELAXED CONTROL, NAMED, per `pkg-diet.yml` and its ruling on
      # #74: Ubuntu 24.04 refuses unprivileged user namespaces, which is
      # what `bwrap` builds every sandbox out of, so without this no
      # composition starts and the isolation lane's seeded escapes cannot
      # execute here either. Tolerant rather than fatal: if the sysctl
      # cannot be set, the honest signal is the isolation tests failing
      # with their own message about the mechanism, not this step erroring
      # first and hiding it.
      - name: Permit the user namespaces the sandbox is built from
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "::warning::the userns restriction could not be relaxed; the isolation tests will say so"

      # And say so, which is what makes the refusal branch a failure HERE
      # and nowhere a contributor's own machine lacks `bwrap`.
      - name: Declare this a host where the sandbox is required
        run: echo "DIET_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"

      # The web surface's seeded fault runs `verify.sh --only exercise` in a
      # sandbox, which installs its dependencies and typechecks: it needs Node
      # and pnpm, at the versions exercise/package.json declares. Every shard
      # gets them, for the reason every shard gets bubblewrap above. These
      # are steps around the selftest, so .github/gate-budget.tsv's
      # `runner_overhead_seconds` is due a re-measure on the first run that
      # has them.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: exercise/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: exercise/pnpm-lock.yaml

      - name: The scope plan this pull request's plan job derived
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: selftest-scope-plan
          path: ${{ runner.temp }}

      - name: ./verify.sh --selftest --shard ${{ matrix.shard }}
        run: >-
          ./verify.sh --selftest
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --census "${{ runner.temp }}/census.tsv"
          ${{ github.event_name == 'pull_request' && format('--scope-plan {0}/scope-plan.tsv', runner.temp) || '' }}

      # Uploaded only on success, deliberately. A shard that failed has
      # already failed the build; its census would say nothing the failure
      # does not, and the aggregate reporting "shard 5 filed no census" is a
      # true statement about a shard that did not finish.
      - name: Keep this shard's census
        uses: actions/upload-artifact@v4
        with:
          name: selftest-census-${{ matrix.shard }}
          path: ${{ runner.temp }}/census.tsv
          if-no-files-found: error
          retention-days: 7

      # ...and on `main` and the nightly, a shard that FAILED keeps its census
      # under another name, because its `not_red` rows are what
      # scripts/selftest-drift.py opens issues from (#112). Not under
      # `selftest-census-*`: the gate's census check reads that pattern, and a
      # failed shard's partial census is not a part of a whole. `ignore`,
      # because a shard that failed before the census was written has nothing
      # to keep, and its failure is already the build's.
      - name: Keep a failed shard's census for the drift issues
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: selftest-not-red-${{ matrix.shard }}
          path: ${{ runner.temp }}/census.tsv
          if-no-files-found: ignore
          retention-days: 7
