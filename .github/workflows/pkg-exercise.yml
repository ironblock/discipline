name: pkg-exercise

# A reusable workflow, composed by verify.yml. It runs the checks
# .github/check-owners.tsv says this package owns -- derived, never named
# here, so the table and the workflow cannot drift apart.
#
# pnpm's version comes from `packageManager` in exercise/package.json. Node's
# major is pinned here (and in gate-selftest.yml) to the one its `engines`
# asks for at least: change them together. The check itself installs the
# dependencies and fetches the browser; this job installs them first only to
# reach Playwright's CLI, for the browser's system libraries, which need the
# runner's package manager -- the check's own install then has nothing to do.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: exercise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The check reads every placed session through diet's own log reader
      # (#300), so it builds the `diet` binary: the pinned toolchain, and a
      # Cargo cache keyed as #306's are, on the runner image.
      - name: Resolve the pinned toolchain
        run: |
          cargo --version
          rustc --version
      - name: Name the runner image for the cache key
        run: echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"
      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: exercise-${{ env.RUNNER_IMAGE }}

      # The shell gate the replay judges with (#389): `diet/wasm` built to wasm32
      # and bound by the `wasm-bindgen` CLI at the exact version that crate
      # pins (exercise/scripts/build-gate.mjs), read from its Cargo.toml so
      # the two cannot drift. Restored from the Cargo cache when warm.
      - name: Add the wasm32 target and the pinned wasm-bindgen CLI
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          pin="$(sed -n 's/^wasm-bindgen = { version = "=\([0-9.]*\)".*/\1/p' diet/wasm/Cargo.toml)"
          test -n "$pin"
          cargo install wasm-bindgen-cli --version "$pin" --locked

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: exercise/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: exercise/pnpm-lock.yaml

      - name: Install the dependencies, and the browser's system libraries
        run: |
          set -euo pipefail
          cd exercise
          pnpm install --frozen-lockfile
          pnpm exec playwright install-deps chromium

      - name: Run the checks this package owns
        run: |
          set -euo pipefail
          mapfile -t checks < <(
            awk -F'\t' -v pkg=exercise '!/^#/ && NF>=2 && $2 == pkg { print $1 }' \
              .github/check-owners.tsv
          )
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "::error::no check is owned by 'exercise'; a workflow that runs nothing is not a pass"
            exit 1
          fi
          args=()
          for check in "${checks[@]}"; do args+=(--only "$check"); done
          printf 'checks owned by exercise: %s\n' "${checks[*]}"
          ./verify.sh "${args[@]}"

      # The replay page this run built and checked (#32): what pages.yml
      # publishes if this run passes on a push to the default branch,
      # downloaded by run id.
      - name: Keep the replay page this run built
        uses: actions/upload-artifact@v4
        with:
          name: site-replay
          path: _site/replay
          if-no-files-found: error
