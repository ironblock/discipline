name: pkg-repo

# A reusable workflow, composed by verify.yml. It runs the checks
# .github/check-owners.tsv says this package owns -- derived, never named
# here, so the table and the workflow cannot drift apart.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The history gate reads commit messages across a range, so a
          # shallow clone would leave it unable to determine a base --
          # which it treats as a failure, correctly and unhelpfully.
          fetch-depth: 0

      - name: Run the checks this package owns
        run: |
          set -euo pipefail
          mapfile -t checks < <(
            awk -F'\t' -v pkg=repo '!/^#/ && NF>=2 && $2 == pkg { print $1 }' \
              .github/check-owners.tsv
          )
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "::error::no check is owned by 'repo'; a workflow that runs nothing is not a pass"
            exit 1
          fi
          args=()
          for check in "${checks[@]}"; do args+=(--only "$check"); done
          printf 'checks owned by repo: %s\n' "${checks[*]}"
          ./verify.sh "${args[@]}"
