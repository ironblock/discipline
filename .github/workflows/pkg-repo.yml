name: pkg-repo

# A reusable workflow, composed by verify.yml. It runs the checks
# .github/check-owners.tsv says this package owns -- derived, never named
# here, so the table and the workflow cannot drift apart.

on:
  workflow_call:

permissions:
  contents: read
  # To ask whether a check this pull request touches has an open drift issue
  # from a full run (#112, #369).
  issues: read

jobs:
  checks:
    name: repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The history gate reads commit messages across a range, so a
          # shallow clone would leave it unable to determine a base --
          # which it treats as a failure, correctly and unhelpfully.
          fetch-depth: 0

      - name: Run the checks this package owns
        run: |
          set -euo pipefail
          mapfile -t checks < <(
            awk -F'\t' -v pkg=repo '!/^#/ && NF>=2 && $2 == pkg { print $1 }' \
              .github/check-owners.tsv
          )
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "::error::no check is owned by 'repo'; a workflow that runs nothing is not a pass"
            exit 1
          fi
          args=()
          for check in "${checks[@]}"; do args+=(--only "$check"); done
          printf 'checks owned by repo: %s\n' "${checks[*]}"
          ./verify.sh "${args[@]}"

      # A PULL REQUEST IS REFUSED WHILE A CHECK IT TOUCHES HAS AN OPEN DRIFT
      # ISSUE (#112), here since a pull request runs no selftest (#369, ruled
      # (c) at 5976704493). The list is pr-scope.py's for the diff, widened by
      # selftest-drift.py to every check when its reason is machinery: a
      # change there reaches every fault. The base is fetched by this job's
      # full-depth checkout.
      - name: No open drift issue against a check this pull request touches
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/pr-scope.py --base "origin/${{ github.base_ref }}" --head HEAD > "${{ runner.temp }}/pr-scope.txt"
          cat "${{ runner.temp }}/pr-scope.txt"
          python3 scripts/selftest-drift.py block-scope "${{ runner.temp }}/pr-scope.txt"
