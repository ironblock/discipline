name: pkg-diet

# A reusable workflow, composed by verify.yml. It runs the checks
# .github/check-owners.tsv says this package owns -- derived, never named
# here, so the table and the workflow cannot drift apart.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: diet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Invoking cargo resolves rust-toolchain.toml, so rustup installs the
      # pinned toolchain here rather than in the middle of a check.
      - name: Resolve the pinned toolchain
        run: |
          cargo --version
          rustc --version
          cargo clippy --version
          cargo fmt --version

      # The isolation lane's six seeded escapes need a sandbox to execute
      # against. Without `bwrap` the lane asserts a correct REFUSAL and
      # passes -- the "0 of 6 executed" case -- so a confinement gate that
      # never confined anything looks exactly like one that did.
      #
      # Ruling on #57 (2026-09-10): add it now, from track three, disclosed,
      # since it is the isolation lane's own requirement. "Green means it was
      # there all along; red means a confinement gate that never confined,
      # which is the one outcome worth two lines of YAML to rule out."
      - name: Install the sandbox the isolation lane confines with
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # And say so, which is what makes the refusal branch a failure HERE and
      # nowhere else. On a contributor's machine with no `bwrap` this stays
      # unset and the refusal passes, exactly as it does today.
      - name: Declare this a host where the sandbox is required
        run: echo "DIET_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"

      # Diagnostic, never fatal. The first run of this workflow found that
      # `bwrap` installs and then cannot start: `--unshare-all` fails with
      # `bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted`,
      # because bringing `lo` up inside a new network namespace is denied
      # here. That is a fact about the runner, and what to do about it
      # depends on WHICH unshares are permitted -- so this asks, rather than
      # leaving it to be guessed at from one error message.
      - name: What the runner's kernel lets the sandbox do
        run: |
          set +e
          echo "bwrap:           $(command -v bwrap) -- $(bwrap --version 2>&1)"
          echo "userns_clone:    $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo 'n/a')"
          echo "userns_apparmor: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'n/a')"
          echo "max_user_ns:     $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo 'n/a')"
          while IFS= read -r flags; do
            [ -z "$flags" ] && continue
            out=$(bwrap $flags --ro-bind / / --proc /proc --dev /dev true 2>&1)
            printf '%-40s exit %-4s %s\n' "$flags" "$?" "$out"
          done <<'PROBES'
          --unshare-all
          --unshare-all --share-net
          --unshare-net
          --unshare-user
          --unshare-user --unshare-pid --unshare-ipc --unshare-uts --unshare-cgroup
          PROBES
          exit 0

      - name: Run the checks this package owns
        run: |
          set -euo pipefail
          mapfile -t checks < <(
            awk -F'\t' -v pkg=diet '!/^#/ && NF>=2 && $2 == pkg { print $1 }' \
              .github/check-owners.tsv
          )
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "::error::no check is owned by 'diet'; a workflow that runs nothing is not a pass"
            exit 1
          fi
          args=()
          for check in "${checks[@]}"; do args+=(--only "$check"); done
          printf 'checks owned by diet: %s\n' "${checks[*]}"
          ./verify.sh "${args[@]}"
