name: pkg-diet

# A reusable workflow, composed by verify.yml. It runs the checks
# .github/check-owners.tsv says this package owns -- derived, never named
# here, so the table and the workflow cannot drift apart.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: diet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Invoking cargo resolves rust-toolchain.toml, so rustup installs the
      # pinned toolchain here rather than in the middle of a check.
      - name: Resolve the pinned toolchain
        run: |
          cargo --version
          rustc --version
          cargo clippy --version
          cargo fmt --version

      # The isolation lane's six seeded escapes need a sandbox to execute
      # against. Without `bwrap` the lane asserts a correct REFUSAL and
      # passes -- the "0 of 6 executed" case -- so a confinement gate that
      # never confined anything looks exactly like one that did.
      #
      # Ruling on #57 (2026-09-10): add it now, from track three, disclosed,
      # since it is the isolation lane's own requirement. "Green means it was
      # there all along; red means a confinement gate that never confined,
      # which is the one outcome worth two lines of YAML to rule out."
      - name: Install the sandbox the isolation lane confines with
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Diagnostic, never fatal, and run BEFORE the sysctl below so the log
      # carries a before-and-after rather than an assertion that something
      # changed. The first runs of this workflow found `bwrap` installing and
      # then failing to start, and this probe found EVERY composition failing
      # -- `--unshare-user` alone included -- with
      # `apparmor_restrict_unprivileged_userns = 1`.
      - name: What the runner's kernel lets the sandbox do (before)
        run: |
          set +e
          echo "bwrap:           $(command -v bwrap) -- $(bwrap --version 2>&1)"
          echo "userns_clone:    $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo 'n/a')"
          echo "userns_apparmor: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'n/a')"
          echo "max_user_ns:     $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo 'n/a')"
          while IFS= read -r flags; do
            [ -z "$flags" ] && continue
            out=$(bwrap $flags --ro-bind / / --proc /proc --dev /dev true 2>&1)
            printf '%-40s exit %-4s %s\n' "$flags" "$?" "$out"
          done <<'PROBES'
          --unshare-all
          --unshare-all --share-net
          --unshare-net
          --unshare-user
          --unshare-user --unshare-pid --unshare-ipc --unshare-uts --unshare-cgroup
          PROBES
          exit 0

      # THE ONE RELAXED CONTROL, NAMED. Ubuntu 24.04 refuses unprivileged user
      # namespaces, which is what `bwrap` builds every sandbox out of, so
      # without this no composition starts and `diet::isolation`'s six seeded
      # escapes cannot execute here at all.
      #
      # Ruled on #74 (2026-09-11), both sides weighed. For: this runner is an
      # ephemeral single-tenant VM that builds one commit and is destroyed,
      # and the control exists to stop untrusted local processes using user
      # namespaces as an attack surface on a SHARED host -- which this is
      # not. Against, honoured by scope: someone chose that default, so the
      # change is not global. It is a named step in the one job that runs
      # these tests, declared here, so anyone reading the workflow sees which
      # control was relaxed and for which tests. Least privilege, declared.
      #
      # NOT a pattern for any host that outlives its job.
      #
      # Tolerant rather than fatal on purpose: if the sysctl cannot be set,
      # the honest signal is the isolation tests failing with their own
      # message about the mechanism, not a YAML step erroring first and
      # hiding it.
      - name: Permit the user namespaces the sandbox is built from
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "::warning::the userns restriction could not be relaxed; the isolation tests will say so"
          # What the runner actually ships, per the same ruling. A setuid
          # `bwrap` behaves differently under `--unshare-user`, and the probe
          # above showed `--unshare-all` reaching loopback setup while
          # `--unshare-user` alone died earlier at the uid map -- which a
          # blanket denial does not explain. Record it rather than theorise.
          ls -l "$(command -v bwrap)"
          echo "userns_apparmor now: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'n/a')"
          bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev true \
            && echo "--unshare-all: starts" \
            || echo "--unshare-all: still refused"

      # And say so, which is what makes the refusal branch a failure HERE and
      # nowhere else. On a contributor's machine with no `bwrap` this stays
      # unset and the refusal passes, exactly as it does today.
      - name: Declare this a host where the sandbox is required
        run: echo "DIET_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"

      - name: Run the checks this package owns
        run: |
          set -euo pipefail
          mapfile -t checks < <(
            awk -F'\t' -v pkg=diet '!/^#/ && NF>=2 && $2 == pkg { print $1 }' \
              .github/check-owners.tsv
          )
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "::error::no check is owned by 'diet'; a workflow that runs nothing is not a pass"
            exit 1
          fi
          args=()
          for check in "${checks[@]}"; do args+=(--only "$check"); done
          printf 'checks owned by diet: %s\n' "${checks[*]}"
          ./verify.sh "${args[@]}"

  # #78, rows 1 and 4 (ruled 2026-09-14): the wasm32 build of the read side,
  # proven against native in a wasm runtime, and the trap control proven
  # against a real failure rather than assumed. A sibling job, not a step
  # added to `checks` above, and not a `verify.sh` check of its own --
  # `check-ci-coverage.py`'s invariant is one-directional (every `verify.sh`
  # check has an owner and a workflow), so an extra job with no check behind
  # it is outside what that guard polices; nothing here required touching
  # `verify.sh`, `tools/gate/*.toml`, or `.github/check-owners.tsv`.
  #
  # `needs: [diet, ...]` in the root `gate` job is satisfied only when EVERY
  # job in this reusable workflow succeeds, so this job failing fails the
  # merge gate exactly as `checks` failing already does.
  wasm:
    name: diet (wasm conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the pinned toolchain and add the wasm32 target
        run: |
          rustup target add wasm32-unknown-unknown
          cargo --version
          rustc --version

      # The version is the exact one `diet/Cargo.toml` pins the crate to --
      # `wasm-bindgen`'s bindgen format is an unstable schema shared between
      # the crate and this CLI, and a mismatch is refused outright rather
      # than warned about (measured on #78; see that Cargo.toml comment).
      - name: Install the wasm-bindgen CLI, pinned to the crate's exact version
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked

      # A fresh-instance review of this PR found `seeded_host_call_trap`
      # failing `-D warnings` under the ONE feature combination that
      # actually compiles it (`wasm,wasm-seeded-host-call-trap`) -- a
      # dormant failure, since neither this job's own `cargo test` (a build,
      # not a lint) nor the `checks` job's clippy step (default features
      # only) ever exercised that combination. Both feature sets named
      # explicitly here so this cannot go dormant the same way twice.
      - name: Lint every wasm feature combination this crate declares
        run: |
          cd diet
          cargo clippy --all-targets --no-default-features --features wasm -- -D warnings
          cargo clippy --all-targets --no-default-features --features wasm,wasm-seeded-host-call-trap -- -D warnings

      # `diet/tests/wasm_conformance.rs` builds both wasm32 artifacts itself
      # (the plain conformance build and the seeded-trap build) and runs
      # them through Node -- this one command is the whole job. See that
      # file's own header for why it does not assume a prior build step.
      - name: Prove the wasm32 read side against native, and the trap control against a real failure
        run: |
          cd diet
          cargo test --no-default-features --features wasm --test wasm_conformance
