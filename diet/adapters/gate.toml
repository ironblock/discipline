# The CLI's codes, ruled on #76: 0 ok, 1 a verdict, 2 usage or could not
# run, 3 input refused. Collapsing 3 into 2 makes a harness that changed
# its format indistinguishable from a typo -- which is the collision the
# ruling was issued to remove, reintroduced in one character.
id = "adapters.a-refusal-collapses-into-the-could-not-run-code"
failure_class = "adapters.a-refusal-collapses-into-the-could-not-run-code"
target = "diet/src/bin/replay.rs"
expect_exit = 101
anchor = '''
const EXIT_REFUSED: u8 = 3;'''
becomes = '''
const EXIT_REFUSED: u8 = 2;'''
catches = [
    "adapters_a_renamed_field_is_refused_with_the_clis_refusal_code_and_no_object",
    "adapters_every_invocation_that_never_reached_an_answer_exits_two",
]

[[fault]]
# A regimen that cannot be OPENED is a file that could not be read; a
# regimen that is read and declined is a document whose schema this tool
# recognises and refuses. Same class as a log whose format moved, same
# code, and the two paths are one line apart.
id = "adapters.a-declined-regimen-is-reported-as-a-failure-to-run"
failure_class = "adapters.a-declined-regimen-is-reported-as-a-failure-to-run"
target = "diet/src/bin/replay.rs"
expect_exit = 101
anchor = '''
            eprintln!("{why}");
            return ExitCode::from(EXIT_REFUSED);'''
becomes = '''
            eprintln!("{why}");
            return ExitCode::from(EXIT_COULD_NOT_RUN);'''
catches = [
    "adapters_every_invocation_that_never_reached_an_answer_exits_two",
]

[[fault]]
# `diet-replay | head` closes the pipe partway through, and the first
# version panicked: a correct census on screen and exit 101 under it. An
# exit code that depends on whether somebody piped the program is not an
# exit code. Its catcher generates its own log, because the defect needs
# more output than a pipe buffer holds.
id = "adapters.a-reader-that-left-is-a-failure-to-run"
failure_class = "adapters.a-reader-that-left-is-a-failure-to-run"
target = "diet/src/bin/replay.rs"
expect_exit = 101
anchor = '''
        Err(why) if why.kind() == std::io::ErrorKind::BrokenPipe => Err(EXIT_OK),'''
becomes = '''
        Err(why) if why.kind() == std::io::ErrorKind::BrokenPipe => Err(EXIT_COULD_NOT_RUN),'''
catches = [
    "adapters_a_reader_that_stops_reading_is_not_a_failed_replay",
]

[[fault]]
