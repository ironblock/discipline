# The `adapters` lane's seeded faults, declared beside the code that emits
# them.
#
# Ruling 1 on PR #59: a lane writes its own faults here and track one wires
# them into `verify.sh` and `tools/gate/faults.toml`; nothing crosses the
# boundary as an edit. This file is that input. **It is not yet wired**, and
# the PR that adds it says so rather than letting an unrun manifest read as a
# gate.
#
# Every entry carries the mutation ITSELF -- the exact source text and what
# it becomes -- so the orchestrator can apply it.
#
# GENERATED BY RUNNING IT. Each fault below was applied to a fresh copy of
# the tree, the injection was proved to have changed that tree, the command
# in `[package]` was run, and `catches` is what actually failed. No entry
# claims a catch it does not have.
#
# That generator was wrong TWICE before it was right, both times about the
# build cache, and both are worth the paragraph because a manifest is only
# worth the run behind it and a run is only worth its isolation.
#
# First: it shared one `target/` directory across the boxes and copied
# sources with their original mtimes. Cargo fingerprints on mtime, so three
# boxes silently reused the binary the PREVIOUS fault had built and were
# scored against that fault's failures. The giveaway was a mutation in
# `diet/src/bin/replay.rs` reported as caught by two library tests that never
# run the binary.
#
# Second: the directory it shared was the REPOSITORY's. Touching the sources
# fixed the staleness between boxes and did nothing about the bleed out of
# them -- the last box left a binary built from a mutated tree in the
# repository's cache, and the next `cargo test` on a clean checkout went red
# on a fault nobody had applied. The boxes now build into a target directory
# of their own. Two trees that are not the same tree do not share a cache.
#
# The drift guard (`every_seeded_fault_still_names_source_that_is_there`)
# fires for EVERY fault by construction, because a mutation is an anchor
# being replaced. So `command` skips it and `catches` excludes it.
#
# The filter is `adapters`, which is #28's own acceptance command, so the
# lane's gate and the issue's row run the same set. Every integration test
# in `diet/tests/replay_cli.rs` is named to match it: an integration test
# has no module path, so a filter it does not carry in its own name reaches
# none of them, and the issue's command would pass having run nothing that
# runs the program.
#
# `--no-fail-fast` is in the command and the other lanes' commands do not
# have it. Without it, a fault caught in the library stops cargo before the
# integration tests run, and every catcher in `diet/tests/replay_cli.rs` --
# which is the only thing that runs `diet-replay` at all -- would be invisible
# to this generator. Four faults here would have been recorded with fewer
# catchers than they have, and the two that live in `bin/replay.rs` would
# have been recorded as caught by nothing.

[package]
name = "diet-adapters"
check = "test"
command = "cargo test --no-fail-fast -p discipline-diet -- adapters --skip every_seeded_fault_still_names_source_that_is_there"
faults = 29

