# how it would arrive in a real patch.
id = "adapters.a-renamed-field-is-read-off-a-neighbour"
failure_class = "adapters.a-renamed-field-is-read-off-a-neighbour"
target = "diet/src/adapters/claude_code.rs"
expect_exit = 101
anchor = '''
    let Some(message) = row.get("message") else {
        return Err(Drift::MissingField {
            at_row,
            kind: kind.to_owned(),
