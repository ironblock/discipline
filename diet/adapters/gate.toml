# The `adapters` lane's seeded faults, declared beside the code that emits
# them.
#
# Ruling 1 on PR #59: a lane writes its own faults here and track one wires
# them into `verify.sh` and `tools/gate/faults.toml`; nothing crosses the
# boundary as an edit. This file is that input. **It is not yet wired**, and
# the PR that adds it says so rather than letting an unrun manifest read as a
# gate.
#
# Every entry carries the mutation ITSELF -- the exact source text and what
# it becomes -- so the orchestrator can apply it.
#
# GENERATED BY RUNNING IT. Each fault below was applied to a fresh copy of
# the tree, the injection was proved to have changed that tree, the command
# in `[package]` was run, and `catches` is what actually failed. No entry
# claims a catch it does not have.
#
# The first run of that generator was WRONG, and the way it was wrong is
# worth the paragraph: it shared one `target/` directory across the twelve
# boxes, and copied sources with their original mtimes. Cargo fingerprints on
# mtime, so three boxes silently reused the binary the PREVIOUS fault had
# built and were scored against that fault's failures. The giveaway was a
# mutation in `diet/src/bin/replay.rs` reported as caught by two library
# tests that never run the binary. A manifest is only worth the run behind
# it, and a run is only worth its isolation.
#
# The drift guard (`every_seeded_fault_still_names_source_that_is_there`)
# fires for EVERY fault by construction, because a mutation is an anchor
# being replaced. So `command` skips it and `catches` excludes it.
#
# `--no-fail-fast` is in the command and the other lanes' commands do not
# have it. Without it, a fault caught in the library stops cargo before the
# integration tests run, and every catcher in `diet/tests/replay_cli.rs` --
# which is the only thing that runs `diet-replay` at all -- would be invisible
# to this generator. Four faults here would have been recorded with fewer
# catchers than they have, and the two that live in `bin/replay.rs` would
# have been recorded as caught by nothing.

[package]
name = "diet-adapters"
check = "test"
command = "cargo test --no-fail-fast -p discipline-diet -- adapt --skip every_seeded_fault_still_names_source_that_is_there"
faults = 13

[[fault]]
# The census is the product. A row kind the adapter has no word for that
# is walked past rather than counted turns 47% of a real log into silence,
# and every count that remains reads as a success.
id = "adapters.an-unmapped-kind-is-walked-past-uncounted"
failure_class = "adapters.an-unmapped-kind-is-walked-past-uncounted"
target = "diet/src/adapters/claude_code.rs"
expect_exit = 101
anchor = '''
            self.census.unmapped_one(kind);'''
becomes = '''
            let _ = kind;'''
catches = [
    "a_kind_the_adapter_never_saw_is_counted_and_does_not_stop_the_replay",
    "adapters::claude_code::tests::a_kind_this_adapter_does_not_map_is_counted_rather_than_dropped",
    "adapters::claude_code::tests::the_committed_corpus_adapts_and_refuses_as_it_says_it_does",
    "an_adapted_session_replays_to_a_census_and_a_working_object",
]

[[fault]]
