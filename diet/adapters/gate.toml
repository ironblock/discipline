# hands back a touch whose path is the empty string and the object gained
# `{"content":"read ","id":"mechanical/file/"}` -- a fact that is not one.
id = "adapters.a-path-that-resolved-to-nothing-becomes-a-fact"
failure_class = "adapters.a-path-that-resolved-to-nothing-becomes-a-fact"
target = "diet/src/bin/replay.rs"
expect_exit = 101
anchor = '''
        if path.as_os_str().is_empty() {
            continue;
        }'''
becomes = '''
        if false {
            continue;
        }'''
catches = [
    "adapters_a_path_that_resolves_to_nothing_makes_no_fact",
]

