# The background-wait scenario's regimen: the model's commands run, without a
# gate decision, on the canned scenario substrate; no interview.

arm = "rehearsal"
dogma_version = 0

substrate = "canned-scenario"
substrate_reasoning = "off"
# The `hardware_fingerprint` of equipment `canned-loopback-scenario` in
# `substrates/registry.toml`.
substrate_hardware = "b6bc80e9e8e4bc2342219f064dab89a8d17c02535600b32b84895fc0b9ba6513"

isolation = "none"
approval = "none"
approval_policy = "approvals are off: every command runs without a gate decision or a prompt"

[limits]
max_steps = 4

[sampler]
temperature = 0.6
top_p = 0.95
seed = 7
