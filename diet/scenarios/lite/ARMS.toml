# The Lite pilot's four reachable arms (#932, #942) minus the reference, which runs as its own batch until #948 (heldout.jsonl):
# `diet-drive arms lite.jsonl --arms ARMS.toml --repeat N --out DIR`. Every arm contrasts with the native baseline.
baseline = "native"
# The first pilot is the plumbing check, not the headline (Planning's review, 2026-10-21): the four reachable arms of the six (three here, the reference its own batch), on the larger rung. The
# headline runs later at the full arm count on the floor.
purpose = "smoke"

[arm.native]
regimen = "native.toml"

[arm.interviews]
regimen = "interviews.toml"
contrast = ["interview_warrant", "refutation_interview", "meditation_carry"]

[arm.golden]
regimen = "golden.toml"
contrast = ["meditation_tail_tokens", "meditation_carry"]
