# A turn whose own steps outgrow the window (#813), on the canned scenario
# substrate's 24000-token window: three long steps, each recording a fact,
# then the answer. Before each of the last two requests the window
# meditation splits the running turn: the refill, the ask, then only its most
# recent step within the budget (2000 tokens here, OpenCode 2's floor); the
# step before it is compacted, its fact in working memory. The turn settles.
arm = "rehearsal"
dogma_version = 0

substrate = "canned-scenario-windowed"
substrate_reasoning = "off"
substrate_hardware = "b6bc80e9e8e4bc2342219f064dab89a8d17c02535600b32b84895fc0b9ba6513"

self_capture = "on"
# Serve keeps working memory for an interview; no ask here is marked
# scoping, so no fork fires and self-capture alone fills it.
interview_warrant = ["scoping"]
max_output_tokens = 512

[sampler]
temperature = 0.6
top_p = 0.95
seed = 7
