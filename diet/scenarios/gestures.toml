# The operator's gestures as scenario steps (the app audit's page walk, F20), on the canned scenario substrate: a read
# whose shadow warrant is offered as a chip, a keep, the operator's own fork, a wrap from its answer, the chip
# accepted, a refused change to an operator entry answered, and a retire. Approvals are off, as every rehearsal's are.
arm = "rehearsal"
dogma_version = 0

substrate = "canned-scenario"
substrate_reasoning = "off"
substrate_hardware = "b6bc80e9e8e4bc2342219f064dab89a8d17c02535600b32b84895fc0b9ba6513"

isolation = "none"
approval = "none"
approval_policy = "approvals are off: every command runs without a gate decision or a prompt"

# Manual first (#1021): nothing forks on its own; the read warrant shadows, offered as a chip (#1031).
interview_warrant = ["scoping"]
interview_shadow = ["read"]
interview_shadow_offer = "chips"
capture_modality = "fields"
# Self-capture writes through the record tools, so a change it tries on an operator entry is refused (#1050).
self_capture = "on"

[limits]
max_steps = 4

[sampler]
temperature = 0.6
top_p = 0.95
seed = 7
