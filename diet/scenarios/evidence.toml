# The `evidence` warrant (#783) on the canned scenario substrate: a step that
# read at least 3000 characters warrants the pinned EVIDENCE ask, filled with
# what it read and how much, in the turn's gap.
arm = "rehearsal"
dogma_version = 0

substrate = "canned-scenario"
substrate_reasoning = "off"
substrate_hardware = "b6bc80e9e8e4bc2342219f064dab89a8d17c02535600b32b84895fc0b9ba6513"

isolation = "none"
approval = "none"
approval_policy = "approvals are off: every command runs without a gate decision or a prompt"

interview_warrant = ["evidence"]
capture_modality = "fields"

[limits]
max_steps = 4

[sampler]
temperature = 0.6
top_p = 0.95
seed = 7
