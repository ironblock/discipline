# The kitchen sink (#798): one session on the canned scenario substrate
# showing every lever that writes a line to the log, each with the value
# that has the most to show. Its log is the page's `kitchen-sink` example.
# It runs on `canned-scenario-windowed`, whose declared 24000-token window
# lets the budget meditation fire at a turn's end and the window meditation
# inside a later turn; the output cap stays small so the window's reserve is
# its 20000-token floor.
arm = "rehearsal"
dogma_version = 0

substrate = "canned-scenario-windowed"
substrate_reasoning = "off"
substrate_hardware = "b6bc80e9e8e4bc2342219f064dab89a8d17c02535600b32b84895fc0b9ba6513"

isolation = "none"
approval = "none"
approval_policy = "approvals are off: every command runs without a gate decision or a prompt"
tool_surface = "standard"
mechanical_capture = "on"

interview_warrant = ["read", "scoping", "evidence", "trouble", "open"]
interview_cadence = "per_class"
interview_timing = "during_turn"
interview_skip_self_recorded = "off"
capture_modality = "fields"
fork_asks = "v4"
fork_view = "last_turn"
fork_delivery = "advisory"

self_capture = "on"
phase_library = "starter"
starting_phase = "plan"

max_output_tokens = 512
meditation_at_context_fraction = 0.2
meditation_every_turns = 6
meditation_audit = "on"
meditation_warm = "on"
meditation_tail_tokens = 400
meditation_tool_outputs = "reference"
render_budget_tokens = 120
archive_recall = "literal"
reconcile_gate = "refuse"
# Two audit chunks in flight at once (#854): a meditation's audit over more
# than eight notes asks in chunks of eight, each line carrying its `chunk`.
meditation_audit_chunk_notes = 8
meditation_audit_concurrency = 2
# Similar notes merged at write time: a fork's LEARNED restating a live one
# is folded into it, its `patch` line naming the entry and their cosine.
note_dedupe = "on"

# The refutation interview (#878): a failed command asks REFUTE_Q in the
# turn's gap, each source cooled on its own. The operator's cooldown is long
# enough that the operator's messages never warrant one here, so each
# refutation fork is a failed command's.
refutation_interview = "on"
refutation_operator_cooldown_steps = 200

# The step warrants' gate by a classifier (#850): every step's probes are
# scored and logged as `warrant.gated`. On the canned substrate the scenario's
# own classifier answers on the substrate's port (`diet-drive scenario`
# passes serve `--classifier-endpoint`), scoring by the scenario's `classify`
# lines; the endpoint below is never called. The model is no model: its id,
# revision and compute units are what the canned classifier reports back.
warrant_gate = "classifier"

[warrant_classifier]
endpoint = "http://127.0.0.1:9"
model = "canned-scenario-classifier"
revision = "0000000000000000000000000000000000000000"
compute_units = "none"
truncation_side = "left"
timeout_ms = 5000
prose_window_sentences = 3
prose_window_chars = 400
output_tail_chars = 400
batch = 8

[warrant_classifier.gotcha]
class = "gotcha"
input = "both"
hypotheses = ["Something went wrong or behaved unexpectedly."]
aggregate = "max"
threshold = 0.5

[warrant_classifier.decision]
class = "decision"
input = "both"
hypotheses = ["A decision was made or changed."]
aggregate = "max"
threshold = 0.5

[warrant_classifier.constraint]
class = "constraint"
input = "both"
hypotheses = ["A constraint was learned."]
aggregate = "max"
threshold = 0.5

[warrant_classifier.open]
class = "open"
input = "both"
hypotheses = ["Something is left open to do next."]
aggregate = "max"
threshold = 0.5

[tool_output]
max_lines = 20

[limits]
max_steps = 4

[sampler]
temperature = 0.6
top_p = 0.95
seed = 7
