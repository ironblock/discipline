# The ast-grep tutorial's bare regimen (#971): bash and the answer tool, no memory levers. A pass is one session from a
# fresh instance; what the tutorial carries between passes is its preamble, never this session's memory.
arm = "ast-grep-bare"
dogma_version = 0

substrate = "ada48-tabbyapi-exl3-qwen38flashnext-2p05"
substrate_reasoning = "on"
# The registry's hardware_fingerprint for the entry's equipment.
substrate_hardware = "19d9fa21007ab8fef48b62d9d8773ac241fa177b2f8b3de670ddd4128aa10c7b"

# The model's commands run in the worktree under the OS's sandbox: reads everywhere but the secrets, writes in the
# worktree alone, and no network. Approvals are off, so `allowed_commands` is the pre-seeded set and gates nothing.
allowed_commands = ["ast-grep", "ls", "cat"]
isolation = "sandbox"
network = "none"
sandbox_reads = "all"
sandbox_secrets = ["~/.config/git", "~/.git-credentials"]
approval = "none"
approval_policy = "approvals are off: every command runs without a gate decision or a prompt; the sandbox confines writes to the worktree"

# DRAFT: no hard cap (the maintainer, 2026-10-26): output length is graded instead. The largest job the pool admits:
# cache_size 524288 less two 2048-token chunks of headroom; the drive cuts each request to what is left (#826).
max_output_tokens = 520192

# No interviews and no working memory.
interview_warrant = []
refutation_interview = "off"
self_capture = "off"

# No nonce (the maintainer, 2026-10-27: the shared prefix is the important bit). Passes with the same head and notes
# share a cached prefix; a new notes version is a new prefix by its own text. pass.py records cached prompt tokens.
head_nonce = "off"

[reasoning]
effort = "xhigh"
budget_tokens = "none"

# The registry's recommended thinking sampler for the line, every key declared.
[sampler]
temperature = 1.0
top_k = 20
top_p = 0.95
min_p = 0.0
