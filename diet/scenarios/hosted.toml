# The hosted path rehearsed (#555): the scenario's replies served as Anthropic
# Messages events by the routed stub, on `canned-scenario-hosted` -- an `api`
# entry on canned weights, so serve speaks the Messages wire, sends a key (`diet-drive scenario`'s
# rehearsal key, never the operator's), and probes no engine. Turn 1
# thinks, calls `ls`, and answers from the cache it wrote; turn 2 is answered
# 529 with a retry-after, and the turn fails, retried by nobody.
arm = "rehearsal"
dogma_version = 0

substrate = "canned-scenario-hosted"
substrate_reasoning = "on"
# The `hardware_fingerprint` of equipment `canned-loopback-scenario` in
# `substrates/registry.toml`.
substrate_hardware = "b6bc80e9e8e4bc2342219f064dab89a8d17c02535600b32b84895fc0b9ba6513"

# Its requests' limits (#555), none with a default: every request the
# session sends, every lane's and every retry, counts against the cap; a
# 429 or 529 is retried at most `api_retries` times, and never when its
# retry-after asks a longer wait than `api_retry_after_max_seconds`.
max_api_requests = 8
api_retries = 2
api_retry_after_max_seconds = 60

isolation = "none"
approval = "none"
approval_policy = "approvals are off: every command runs without a gate decision or a prompt"

[limits]
max_steps = 4

[reasoning]
effort = "low"
budget_tokens = "none"

[sampler]
temperature = 1
