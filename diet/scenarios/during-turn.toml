# Interviews during the turn (#782) on the canned scenario substrate: the
# `read` warrant at the per-class cadence, each step's forks cut as the trunk
# stood after its results and sent beside the trunk's next request.
arm = "rehearsal"
dogma_version = 0

substrate = "canned-scenario"
substrate_reasoning = "off"
substrate_hardware = "b6bc80e9e8e4bc2342219f064dab89a8d17c02535600b32b84895fc0b9ba6513"

isolation = "none"
approval = "none"
