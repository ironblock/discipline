[package]
name = "discipline-diet"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "diet"
path = "src/lib.rs"

[[bin]]
name = "diet"
path = "src/bin/diet.rs"

[dependencies]
minijinja = "2.5.0"
minijinja-contrib = { version = "2.5.0", features = ["pycompat"] }
pest = "2.9"
pest_derive = "2.9"
# A real JSON reader for a FOREIGN format. The record's own value space is a
# deliberate subset (no null, no exponents, no binary floats) and a live
# inference server's reply carries all three; pointing the record's reader at
# the wire would be one format with two implementations.
serde_json = { version = "1", features = ["arbitrary_precision"] }
# SHA-256, because `summary.product_sha256` is the record's IDENTITY
# primitive -- binary provenance, consumed digests, engine identity. Ruling 7:
# a cryptographic primitive is the canonical buy, and this is the one place a
# subtle bug is both catastrophic and silent. The hand-rolled implementation
# this replaces passed every published vector and a 221-input differential;
# that is not the argument. The argument is that nobody should have to check.
#
# `default-features = false`, per the ruling on disclosure 1: the dependency
# was accepted for the primitive, not for its feature set. Its default is
# `["alloc", "oid"]` and `diet::digest` needs neither -- `Digest::digest`
# returns a fixed-size array, and nothing here speaks ASN.1 object
# identifiers. Dropping them takes `const-oid` out of the tree entirely:
# nine transitive crates rather than ten. No feature is added back, because
# the empty set is what compiles.
sha2 = { version = "0.11", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# TLS for a hosted API (#555), bought rather than written under ruling 7: a
# cryptographic protocol is the canonical buy. `rustls` with `ring`'s
# primitives, no default features (no `aws-lc-rs`, no logging), and the
# Mozilla roots as `webpki-roots` ships them, so a certificate is checked the
# same way on every machine. Twelve crates in all, measured 2026-10-10.
# Not on wasm32: the exercise's wasm build has no sockets to put TLS on.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
# A self-signed certificate for the local TLS server the TLS path is tested
# against (#555), made at test time: the hygiene gate refuses a committed
# private key, and hand-assembling X.509 over `ring` would be the bespoke
# encoder ruling 7 rules out. Test-only; seven crates.
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }

[lints]
workspace = true

[[bin]]
name = "diet-drive"
path = "src/bin/drive.rs"
