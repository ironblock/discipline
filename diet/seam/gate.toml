# The `seam` lane's seeded faults, declared beside the code that emits
# them.
#
# Ruling 1 on PR #59: a lane writes its own faults here and track one wires
# them into `verify.sh` and `tools/gate/faults.toml`; nothing crosses the
# boundary as an edit. The shape is what #46's orchestrator wants, so this
# file is its input rather than a description for a person to retype.
#
# Every entry carries the mutation ITSELF -- the exact source text and what
# it becomes -- so the orchestrator can apply it. A fault described in prose
# is a fault somebody has to reconstruct, and reconstruction is where a
# seeded case stops testing what it says it tests.
#
# GENERATED BY RUNNING IT. Each fault below was applied to the tree, the
# lane's tests were run, and `catches` is what actually failed. No entry
# claims a catch it does not have.
#
# `catches` excludes this lane's own drift guard
# (`every_seeded_fault_still_names_source_that_is_there`), which fires for
# every fault by construction because a mutation IS an anchor being
# replaced. Listing it against all of them would make the field say nothing.

[package]
name = "diet-seam"
check = "test"
command = "cargo test -p discipline-diet -- seam"
faults = 18

[[fault]]
id = "seam.cadence-fires-always"
failure_class = "seam.cadence-fires-always"
target = "diet/src/seam/mod.rs"
expect_exit = 101
anchor = '''
.is_some_and(|every| self.turn > 0 && self.turn.is_multiple_of(every)),'''
becomes = '''
.is_some_and(|_| self.turn > 0),'''
catches = [
    "seam::tests::seams_fire_on_the_declared_cadence_and_nowhere_else",
    "seam::tests::the_prefix_does_not_move_while_the_object_does",
    "seam::tests::the_prefix_is_byte_identical_between_seams_and_changes_only_at_one",
]

