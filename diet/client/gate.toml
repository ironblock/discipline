# no pause after the piece, and the call blocks (red) only if that chunk is
# read before the cancel is asked; if it arrives after, the read wakes, sees
# the cancel, and the test passes (selftest shard 15 of run 37021427242, on
# a branch that does not touch the client). Its subject is the timings
# chunk, not the socket, so it is dropped, as #252's ruling (b) dropped one:
# the two below catch the fault on every schedule.
