# its stub writes the timings chunk separately, and when that chunk lands on a
# read AFTER the cancel, the post-read flag check returns `Cancelled` without a
# stopper (stream.rs's `if cancel.is_asked()` after a read). It catches this
# fault only when both chunks arrive in one read -- a property of TCP's split,
# not of the code. It missed once in track three's run; it stays a catcher of
# what it tests, which is not the stopper.

[[fault]]
