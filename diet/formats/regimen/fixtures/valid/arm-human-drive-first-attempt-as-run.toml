# the human-driven session arm as it ran in attempt 1 of the first human-paced drives (2026-08-09): the T0/ecological instrument, a person pacing turns against the served model
# as run, this attempt omitted the [triggers] table and so fired the bare control while intending diet; it is preserved as the record of what actually drove
#
# carried since the schema batch grew a second level of table: [serving.flags]
#   and the binding under it. This is the fifth arm of the five whose
#   defining serving flag sat one level down; the four cache-ram sweep cells
#   were re-rendered first and this one was missed.
# not carried: the source's quoting of the key. It writes "--cache-ram" = 8192;
#   this grammar has no quoted key, so the fixture writes --cache-ram = 8192.
#   TOML reads a bare key and a basic-string key of the same characters as one
#   key, so the binding is carried exactly and only its spelling differs.
#
# [serving] is the header the arm declared, and its content -- the [serving.flags]
# table and the binding under it -- is carried below rather than described above.
name = "human-driven"
[sampler]
temperature = 0.9
top_k = 20
top_p = 1.0
max_tokens = 65000            # >= Pi's observed max gen (2494 tok)
preserve_thinking = true     # server-matched; moot with thinking-off
enable_thinking = true      # main lane OFF (Pi-identical); Run 2 = true
interview_thinking = true   # moot (no capture forks); set for consistency
# [limits]
# max_steps = 30
# turn_timeout_s = 2400
# tool_timeout_s = 120
[serving]
[serving.flags]
--cache-ram = 8192
