# Extraction-seat bench — SEAT C: NO in-loop extraction fork at all.
# The extraction role is played OFFLINE by GLiNER over the same recorded tool
# outputs (the offline GLiNER seat instrument), scored on the same quality
# rubric as seats A/B.
#
# Regimen v1 conformance fixture of that arm as written. Two constructs in the
# source are outside the v1 grammar and are not carried, not approximated:
#   not carried: expected_absent = ["--cache-ram", "-cram"] — the regimen grammar has no arrays
#   not carried: [serving.flags] — the regimen grammar has no nested tables (the source header has no bindings under it)
# The [serving] header itself is kept, and is empty here for that reason.
#
# Identical to seat A (warm full-prefix fork on the main 27B) except `extraction = false`. In-loop
# this seat is the CONTROL for the physics: interviews (the same gate config
# as A/B — see seat A's header for the measured-not-identical caveat) still
# fire, so its per-turn probes measure the interview-only contention floor —
# seat A minus seat C is the warm-prefix extraction fork's marginal main-lane
# cost, seat B minus seat C should be ~zero on the main lane (the 1.7B
# absorbs the work).
# See seat A's header for the shared seat-bench deviations (never seam).
name = "die45-seat-c-gliner"
[sampler]
temperature = 0.6
top_k = 20
top_p = 1.0
max_tokens = 4096            # byte-matches the recorded on-wire params
preserve_thinking = true
enable_thinking = false
interview_thinking = false
[limits]
max_steps = 30
turn_timeout_s = 2400
tool_timeout_s = 120
[triggers]
enabled = true
evidence_threshold = 3000
extract_threshold = 1500     # kept identical (it gates nothing with extraction off,
                             # but the arm should read as "same gates, one seat knob")
trio_cooldown = 3
open_next_every = 10
ratify = false               # seat-bench deviation: never seam (see seat A)
seam_every_turns = 0
supersede = true
extraction = false           # SEAT C: extraction happens offline (GLiNER)
rationale = false

[serving]
# expected_absent (an array) is not carried; see the header of this file.
