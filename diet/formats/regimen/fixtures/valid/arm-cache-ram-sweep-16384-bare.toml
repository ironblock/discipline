# Level-2 --cache-ram sweep, cell 1 (16384 MiB): the bare capture-intensity arm, cloned from the Run-1 Pi-parity control (verbatim-summary replay, thinking off) with --cache-ram declared explicit; its compaction first_at was re-pinned on 2026-08-05.
#
# Rendered as a regimen v1 conformance fixture. Bindings the grammar cannot
# express are not carried and not approximated:
#
# not carried: [serving.flags] — the regimen grammar has no nested table header
# not carried: "--cache-ram" = 16384 — the regimen grammar has no nested table
#   (the binding sits under [serving.flags]) and no quoted key
#
# The one-level [serving] header itself is kept, empty, as the arm declares it.
#
# --cache-ram SWEEP, CELL 1 (16384 MiB). Cloned from arm-bare.toml
# (Run 1 Pi-parity control, verbatim-summary replay, thinking OFF), originally
# with exactly one change (--cache-ram declared explicit). See
# arm-diet-cacheram16384.toml and the sweep's design note for the full
# rationale — this pairs with that file as the bare/diet capture-intensity
# contrast at the same --cache-ram level, the dose-response axis the sweep
# asks for.
#
# --cache-ram is now DECLARED EXPLICIT at 16384 MiB (2x the incumbent 8192
# compiled default) instead of inheriting pi-parity.toml's `expected_absent`
# reliance on the default.
name = "l2-bare-cacheram16384"
[sampler]
temperature = 0.6
top_k = 20
top_p = 1.0
max_tokens = 4096            # >= Pi's observed max gen (2494 tok)
preserve_thinking = true     # server-matched; moot with thinking-off
enable_thinking = false      # main lane OFF (Pi-identical); Run 2 = true
interview_thinking = false   # moot (no capture forks); set for consistency
[limits]
max_steps = 30
turn_timeout_s = 2400
tool_timeout_s = 120
# --cache-ram sweep cell 1: --cache-ram DECLARED explicit at 16384 MiB. See
# arm-diet-cacheram16384.toml's [serving] comment — same declared deviation,
# same [[deviation]] entry in pi-parity.toml covers both arms of this cell.
# (The declaration itself sat under [serving.flags]; the header block above
# says why it is not carried.)
[serving]

[native_compaction]
every_turns = 2
first_at = 2                 # REV-9.1 pin (a planning ruling), not the Run-1 fossil (1).
                             # PATCHED post-2026-08-05 real-fire attempt: this cell
                             # cloned from arm-bare.toml (first_at=1, correct THERE —
                             # it replays Pi's archived odd-turn positions) and
                             # inherited the value along with everything else, which
                             # made bare-1 fail REV-9 §6.2 twice, deterministically,
                             # against fire.sh's then-hardcoded first_at=2 CLI default
                             # (recorded in the sweep's design note, §9.4).
                             #
                             # Planning's ruling (2026-08-05): fix
                             # BOTH sides, not one — fire.sh now reads each arm's own
                             # declared cadence instead of a hardcoded default (see
                             # fire.sh's per-arm cadence lookup), AND this arm
                             # patches to the current pin, because era doctrine makes
                             # the comparability-to-Run-1 concern moot: this sweep is
                             # a WITHIN-SWEEP characterization (cells compared to each
                             # other, all under one cadence), never a Run-1 comparison
                             # — Run 1's own first_at=1 was already forbidden as a
                             # comparison basis by the regime-tag rule regardless.
                             # arm-bare.toml itself is untouched: it is Run-1's own
                             # fired, era-tagged record, correct as it stands.
# "inputs/summaries.json", not "summaries.json" — see arm-bare.toml's own
# comment on this; `Arm::load` resolves relative to THIS FILE'S directory,
# which is the same directory as arm-bare.toml, so the same relative path
# resolves the same way.
summaries_file = "inputs/summaries.json"
