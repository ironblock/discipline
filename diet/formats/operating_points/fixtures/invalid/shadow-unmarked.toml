# THE RETIRED SPELLING of the per-model operating points. REFUSED, on purpose.
#
# This is the dogma as it was written until 2026-09-13, kept because the
# document that motivated a rule is the best fixture for it. `qwen3` is a
# substring of `qwen3.6` and of `qwen3.5` and carries no `fallback = true`, so
# which entry serves `qwen3.6-27b` depends on the order the three tables happen
# to be written in. The file was correct only because `qwen3` was written last,
# and a comment above the tables explained the ordering to whoever edited it.
#
# A comment is not a rule. A consumer reading these tables into an unordered
# map -- which the old header explicitly warned against, in prose -- got the
# other answer and no error, and `qwen3`'s `thinking_kwarg = false` is the
# control that does not work on the 3.6 family.
#
# `operating_points::parse` now refuses this shape outright. The dogma carries
# the mark, so the ordering stopped being load-bearing, and this file is what
# holds that refusal to something that actually happened rather than to a
# document invented to fail.
#
# Nothing reads it at run time. The measurements, receipts, samplers and gates
# below are the dogma's own, unchanged, so that the ONLY thing wrong with this
# file is the missing mark.

[qwen3_6]
match           = "qwen3.6"
nothink_ops     = ["extraction"]
thinking_kwarg  = true
preserve_thinking = true
[qwen3_6.sampler]
temperature = 0.3
top_k       = 20
top_p       = 1.0
[qwen3_6.gate]
temperature = 0.0
votes       = 1
[qwen3_6.receipts]
nothink = "Measured: suppressing thinking collapses this family's judgment (open questions captured 19 -> 0), so judgment keeps thinking and only extraction is safe without it."
thinking_kwarg = "the /no_think soft switch is DEAD on this model; the kwarg is the only working control."
preserve_thinking = "Load-bearing for cache cleanliness: with it off, the prefix a fork re-sends is not byte-identical to what the session sent, and the fork prefills cold. Must never leave the launch line."
gate = "The '9 of 9' precision figure in circulation is the pre-commit gate's 8 of 8 pooled with a separate run's 1 of 1: nine correct precision draws of nine, arithmetically exact, resolved 2026-08-14. Not a report error; two runs' figures were being read as one. The sampler values were never in dispute."

[qwen3_5]
match          = "qwen3.5"
nothink_ops    = ["extraction"]
thinking_kwarg = true
[qwen3_5.sampler]
temperature = 0.3
top_k       = 20
top_p       = 1.0
[qwen3_5.gate]
temperature = 0.0
votes       = 1

[qwen3]
match          = "qwen3"          # the original Qwen3 honours /no_think
nothink_ops    = ["extraction"]
thinking_kwarg = false
[qwen3.sampler]
temperature = 0.3
top_k       = 20
top_p       = 1.0
[qwen3.gate]
temperature = 0.0
votes       = 1

[gemma]
match             = "gemma"
nothink_ops       = ["extraction", "judgment", "audit"]
thinking_kwarg    = true
preserve_thinking = false
[gemma.sampler]
temperature = 1.0
top_k       = 64
top_p       = 0.95
[gemma.gate]
temperature = 1.0
votes       = 5
[gemma.receipts]
sampler = "Measured on the cross-model run: the model card's temp 1.0 / top_k 64 / top_p 0.95 is REQUIRED; temp 0 made real capability look absent."
gate = "needs majority vote (5) even to review; a single sample is not enough on this model."
nothink = "no-think is SAFE broadly here — judgment stayed robust (18 -> 17), the opposite of Qwen."
preserve_thinking = "absent by spec on this model."
note = "needs an explicit proactive-capture prompt; Gemma captures reactively where Qwen captures proactively."
