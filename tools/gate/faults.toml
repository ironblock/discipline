# The fault-migration manifest: what parity means.
#
# `verify.sh` proves every fault below red and asserts every mechanic below.
# The counts live in `[meta]`, where check-fault-manifest.py compares them
# against what verify.sh actually does; a count restated in prose is a count
# that goes stale, and this header carried a stale one for three commits.
# The RED count is not among them: it is derived from the entries below and
# printed by check-fault-manifest.py, never hand-edited (ruled on #108,
# 2026-09-24) -- a number every fault-adding PR had to retype was a conflict
# between every two of them, and the same class as the shard plan's rows.
#
# The replacement gate retires the old one only when it proves EVERY entry
# here -- equivalence before retirement, the program's instrument law applied
# to gates.
#
# `failure_class` is the reframing. The old gate matched a message string,
# which is grep-as-verdict one level up and is why signatures went stale twice.
# The new gate emits a structured failure record per finding and a seeded case
# asserts on its CLASS. `legacy_signature` is recorded only so the migration
# can be checked against what the old gate actually did; nothing should ever
# match on it again.
#
# `migrated_to` names where an entry's assertion lands when the old gate
# retires. The eight subset-fixtures carry one: today each is rejected twice,
# by diet's parser and by tomllib. When program-format parsing moves into diet
# there is no second reader, so the tomllib half has nowhere to live and
# check-toml-subset.py ceases to exist. The fixtures do not disappear -- they
# become ordinary conformance fixtures -- but the accounting has to say so, or
# the count drops and reads as coverage loss. diet's own test has been seen red
# on all eight already; they flip to migrated only when the old copies retire.
#
# scripts/check-fault-manifest.py keeps this in step with verify.sh: an entry
# here that verify.sh does not prove, or a fault verify.sh proves that is
# absent here, is a failure. Parity cannot drift into a claim.
#
# This file is the orchestrator's own manifest format. Program formats --
# regimen, run.jsonl, the report front-matter -- stay in `diet`.

[meta]
source = "verify.sh"
mechanics_assertions = 119
unseedable_guards = 2
migrated = 0

# A guard genuinely too dangerous to seed -- covering it would re-enter
# `--selftest` from inside itself -- is declared here rather than left
# silent. Each entry's `reason` must appear verbatim as an
# `unseedable: <reason>` comment in `file`; check-fault-manifest.py checks
# this on every run, so a tag quietly dropped from the code goes red the
# same way a `claim:` whose test disappeared does (#77).
[[unseedable]]
id = "selftest.empty-shard-declares-pass"
file = "verify.sh"
reason = "a re-entrant --selftest call would recurse into the function containing it; proved by hand instead"

# The same class, and the same reason. `in_shard` and `load_shard_plan` refuse
# three states -- a fault the assignment does not name, an assignment packed
# for a different N than the caller passed, and no assignment at all -- and all
# three are only reachable under `--selftest --shard`. A seeded case runs
# `verify.sh --only CHECK`; nothing it can run gets there, and an assertion
# that invoked `--selftest` would re-enter the function the guards sit in.
# Proved by hand, transcript in the commit that added them.
[[unseedable]]
id = "selftest.shard-assignment-refusals"
file = "verify.sh"
reason = "the sharded selftest's refusals cannot be seeded without re-entering --selftest; proved by hand instead"


