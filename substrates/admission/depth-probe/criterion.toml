# The ruled word for the depth probe (#143, planning 2026-09-29): no cliff = every cell within one
# sample of the zero-pad control; five samples a cell; no server error tolerated.
within = 1
min_samples = 5
max_errors = 0
# planning (#143, comment 5921525110): a thinking-on application sample whose reply shows thinking did not engage is
# invalid -- discarded, recorded, and re-drawn; a cell may re-draw at most this many times, after which an invalid
# sample is kept, so a cell that cannot fill five valid samples reads unadjudicated. Two or more invalid samples in one
# cell is a kwarg-delivery finding, noted beside the word.
max_redraws = 3
