# capture tool reads `rpm-ostree status` and takes `base-checksum` where it
# exists, which names the upstream base IMAGE and does not change when packages
# are layered locally on top of it. Verified on the machine 2026-09-07: the
# booted 44.20260902 deployment reports base-checksum `b7807f90a98c...` -- the
# value every capture carries -- and its own checksum `48f798c562fe...`, which
# no capture records. The deployment checksum is the more specific identity;
# the base-checksum is what the archive has, and calling it the deployment's
# digest without saying so would overstate what an instance pins.
hazards = "speculation (DFlash) is not bit-exact with the spec-off path: on #161's prompt at greedy decoding, every on/off pair first differs at token 51, and spec-off is bitwise reproducible within a process and across two; spec-on is not reproducible with itself: after a restore, the server's first request (3,362 drafted) diverged from the next four (2,604-2,610 drafted) at token 67 (substrates/admission/accel24-beellama-qwen27b-q4kxl/7c254834cc2c/, 2026-09-29). The margins at the divergences are unmeasured. The template does not read a reasoning_effort key: every level renders identically. Nothing may be gated on token identity"
effort = "n/a (template has no levels)"
effort_is = "every level tried returns HTTP 200 and renders identically: the template reads no reasoning_effort key, so every level is a silent no-op (substrates/admission/accel24-beellama-qwen27b-q4kxl/7c254834cc2c/raw/refusal.json, raw/kw.json). Eligibility is on the rendered state (planning, #143, comment 5885752512): a claim that declares effort n/a is eligible here; a claim that requests a level is ineligible, because its regime would name an instruction the head never carried"
reasoning_strength = "ignored"
reasoning_strength_is = "the template reads no reasoning_strength key: a silent no-op"
engine_libraries_read = "process"
engine_libraries_is = "read from the running production process on 2026-10-01T05:12Z, minutes after its restore (started 05:05:20Z): the same 29 files and fingerprint as the directory read from disk, and all of them equal to the members of the pinned release tarball (engine_release_tarball_sha256; measurements/2026-10-01-engine-libraries/tie.py). The process maps 9 of the 29 (ggml loads its backends by dlopen; libggml-cpu-haswell.so is this CPU's variant), each the same inode it hashed; measurements/2026-10-01-engine-libraries/beellama-floor-process.json"
engine_fingerprint = "8973ae1c11282f4c9ffc81f6e7821b0dcf14599a630ffe3812d6d7e24ba528a4"
engine_fingerprint_is = "sha256 of the exe digest and every library digest, canonically serialised (check-fingerprints.py, engine_fingerprint)"

