# The test-equipment registry.
#
# A manifest of the hardware available for testing, in detail, plus one entry
# per SUBSTRATE -- a served model on a machine, which is not the same thing. Two
# of this program's substrates are the same machine, so a registry keyed by
# machine could not record the experiment that compares them.
#
# FULL SPECIFICATIONS, NOT CLASS DESCRIPTIONS, per the ruling on #52. A class
# description ("a 24 GiB Ampere-class card") erases exactly the facts diagnosis
# needs, and platform-specific cannot be told from systemic without them. The
# excluded set is IDENTITY, and only identity: serial numbers, MAC addresses,
# hostnames, physical location. A product name is a specification.
#
# Read `substrates/README.md` for what an id means, what an instance means, and
# where this file departs from a ruling and why.
#
# PROVENANCE IS PER FIELD. Every value is measured on the machine or read out of
# a committed record, and each block says which and when. An inference carries
# `*_inferred = true` and states what it was inferred from. A specification the
# amendment names and nobody has measured is listed as absent, by name, so the
# gap is visible rather than merely empty.

[registry]
version = 1


# ---------------------------------------------------------------------------
# entry types, and the hardware fields each one declares
# ---------------------------------------------------------------------------
#
# `hardware_fingerprint` is a digest over an entry's DECLARED hardware fields,
# and this is where the declaration lives -- per entry TYPE, so an Apple entry's
# `chip` and a workstation's `model_identifier` are both covered by name rather
# than by a fixed list that happened to fit one of them. A first attempt used a
# single list across all three entries and silently covered TWO of twelve fields
# on the Apple machines, because their entries name different things. That is why
# the coverage rule below exists.
#
# COVERAGE RULE. Every field a type declares must be PRESENT on every entry of
# that type, and the digest is over exactly those fields. A fingerprint covering
# fewer fields than its type declares is a failure, not a smaller fingerprint --
# one that quietly covers two of twelve is worse than none.
#
# EXCLUDED BY RULE, and enforced rather than remembered:
#   * `os` and anything naming a deployment. Those are the INSTANCE. A hardware
#     fingerprint that changes on an operating-system update is not one.
#   * any field marked `<name>_inferred = true`. An unverified claim baked into
#     an identifier is one nobody can correct later without changing the
#     identity of every record that cites it. The laptop's core counts are the
#     live case: measured nowhere, so absent from its type's list.

[entry_type.accelerator-host]
hardware_fields = [
  "accelerator", "accelerator_memory_mib", "accelerator_driver",
  "accelerator_vbios", "accelerator_power_limit_w",
  "accelerator_power_limit_ceiling_w", "accelerator_max_sm_clock_mhz",
  "interconnect", "cpu", "memory", "board", "firmware", "storage", "cooling",
]

[entry_type.x86-workstation]
hardware_fields = ["model_identifier", "cpu", "memory", "gpu", "architecture"]

[entry_type.canned-server]
# A canned server is equipment with no hardware: a program inside this
# repository that replays a fixed set of acts, byte for byte, on loopback. Its
# identity is exactly two artifacts -- what serves, and what it plays -- and
# those are its "hardware fields", because together they determine every reply
# the way a card and a set of weights do for a served model. Ruled on #68 in
# place of a sentinel string in a field defined as a registry digest.
hardware_fields = ["serves", "acts_sha256"]

[entry_type.apple-silicon-laptop]
hardware_fields = [
  "chip", "memory", "storage", "gpu_wired_memory_limit_mb",
  "gpu_wired_low_watermark_mb",
]

