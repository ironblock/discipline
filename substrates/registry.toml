# Instances, oldest first. Each is pinned by a committed substrate capture in
# the private research archive; the capture's date is the instance id.
#
# `os_deployment_digest` IS THE BASE-CHECKSUM, not the deployment's own. The
# capture tool reads `rpm-ostree status` and takes `base-checksum` where it
# exists, which names the upstream base IMAGE and does not change when packages
# are layered locally on top of it. Verified on the machine 2026-09-07: the
# booted 44.20260902 deployment reports base-checksum `b7807f90a98c...` -- the
# value every capture carries -- and its own checksum `48f798c562fe...`, which
# no capture records. The deployment checksum is the more specific identity;
# the base-checksum is what the archive has, and calling it the deployment's
# digest without saying so would overstate what an instance pins.
