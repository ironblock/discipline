serving_flags = "-ngl 99, -t 16, -ctk q8_0, -ctv q8_0, -fa on, -b 1024, -ub 512, -np 4, --kv-unified, --jinja, --spec-type draft-mtp, --spec-draft-ngl 99, --spec-draft-n-max 3, --spec-draft-p-min 0.0, --api-key set; no --reasoning-format, so reasoning streams as reasoning_content and the template preserves it"
serving_flags_are = "read off the running process's command line on 2026-09-28 and identical to the machine's recorded launch file; model paths and the key withheld. On 2026-10-01 the running command line equals the launch file byte for byte and differs from the 2026-09-28 line only in the executable's checkout directory: model paths, draft and every flag identical (the inference seat)"
hazards = "greedy output with the MTP draft is not bit-exact with the spec-off path on this hybrid architecture: on five prompts, 36 of 2,327 positions (1.5%) disagree, the first between tokens 21 and 101, and every disagreement is a flip to the spec-off path's second-ranked token at a top-2 margin of 0.007-0.320 logits; which side of a near-tie is taken depends on the verify schedule (substrates/measurements/2026-09-29-ada-invariance/ and 2026-09-29-ada-invariance-ground-truth/). Acceptance at greedy is exact equality with the verify batch's argmax by source (e7051ef common/sampling.cpp:678-706); this build fills no probs on speculated tokens, so the verify batch's logits are unmeasured. Spec-off greedy output was bitwise reproducible within and across processes, and spec-on across processes on one prompt. Separately, with the draft off a same-binary teacher-forced rerun disagrees with a prior run's logits on the top token at about 2.1-2.4% of positions (the inference seat's measurement). These measurements were taken on e7051ef; for concurrency see hazard_regime_boundary. Nothing may be gated on token identity. A hybrid recurrent model, so warm reuse after a divergence depends on where checkpoints land"
hazards_corrected = "an earlier text gave 'the argmax flips about 2% per step, measured by the inference seat'; that figure was another team's vLLM measurement, not this machine's, corrected by the inference seat 2026-09-28; the 2026-09-28 text then read 'run-to-run nondeterminism of the same order exists here without speculation ... the speculation-specific component is unmeasured', replaced 2026-09-29 by the on/off/off measurement; the 2026-09-29 text first read 'speculation is not output-invariant here', re-worded the same day after the ground-truth reads showed every divergence to be a near-tie flipped to the runner-up"
hazard_regime_boundary = "the build e486f80 (e7051ef plus the cherry-picked upstream llama.cpp PR #29166, 'fix per-block QSA bias indexing') CROSS-CONTAMINATES concurrent requests: it builds the per-block visibility map for one sequence per stream and applies it to every token, and under --kv-unified the four slots share one stream. Measured 2026-10-03 by the inference seat (substrates/measurements/2026-10-03-ada48-concurrency/; #143 5966611289): four ~10,000-token passages asked to continue, greedy, thinking off -- on e486f80, with and without MTP, concurrent request 1 continued request 0's passage and request 2 request 1's, while each was correct alone; on e7051ef every request continued its own passage, alone and four at once. By the inference seat's source reading (#143 5966611289), the hazard needs more than one sequence in a ubatch: -np > 1 with concurrent requests whose context reaches a full QSA block; no threshold was measured. The inference seat also reports a first-sentence lookup correct under concurrency at 2k and 10k on e486f80 (substrates/measurements/2026-10-03-ada48-concurrency/README-concurrency.md), with no outputs committed. Span: e486f80 served production from 2026-09-30 about 23:20Z (instance 2026-10-01) to 2026-10-03T06:58:30Z, when production was reverted to e7051ef (instance 2026-10-03). Multi-stream results inside the span carry the hazard; single-stream results do not, and e7051ef before and after the span is clean by that measurement. Every claim fired here ran at concurrency 1 and before the span (results/2026-09-29-false-nomination-edit-rate-second-substrate)"
hazard_regime_boundary_corrected = "the 2026-10-01 text read the boundary backwards: it called e486f80 the fix (#29166) and said multi-stream results BEFORE 2026-09-30 23:20Z carried the hazard; the inference seat's 2026-10-03 measurement showed e486f80 to be the contaminating build and e7051ef clean"
hazard_spec_draft_fit = "with -fit on and no --spec-draft-ngl 99, llama.cpp silently places the MTP draft head on the host, not the card; an L40S's 'could not fit' was this, not capacity (planning, #143, comment 5922544337 (2026-10-01), from the inference seat's serving status; a fact the record carries, not measured by the data seat). This entry's serving line gives --spec-draft-ngl 99 (serving_flags)"
hazard_kv_sparse_patch = "q8_0 KV without the q8-sparse-fa patch disables the sparse-attention decode path entirely: every token is a dense scan of the whole pool (planning, #143, comment 5922544337 (2026-10-01), from the inference seat's serving status; a fact the record carries, not measured by the data seat). This entry's engines carry the patch: engine_commit_is records e486f80 as e7051ef plus one commit with the q8-sparse-fa patch unchanged; a build without it is a different engine"
dialect_sampler_echo = "none on the chat endpoint: /v1/chat/completions replies carry no generation_settings (or other sampler echo) in any committed capture -- R3.0's unstreamed reply, diet/client/fixtures/llama-server-e7051ef-unstreamed.http, sha256 d9d2e92ee5c067736d60da5baf56edc71e14c3de4a5965e1e7a89eaa895b4727, and the streamed captures -- and no request flag that might add one was tried. So the llama.cpp dialect declares no echo site here, and a sampler pin sent to this endpoint is unverified by echo (#159; what a record does with that is #143's cell rule). The native /completion reply did carry generation_settings in a probe on 2026-09-29; that reply was not captured"
engine_libraries_read = "process"
engine_libraries_is = "read from the reverted production process, 2026-10-03, by the inference seat with check-fingerprints.py from main (--read-engine-pid): the process maps exactly the eight shared objects in its directory (substrates/measurements/2026-10-03-ada48-concurrency/revert-process-read.json, sha256 09b72e684c75e7997dad70c759ac8ec7702f0d382156e1a78ae97d2ce1fffc1a)"
engine_fingerprint = "a08e5511390e70f9b92401284a5587a20163a9528a14982ecf8589d88290dea4"
