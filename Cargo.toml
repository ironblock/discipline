[workspace]
resolver = "3"
members = ["diet"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ironblock/discipline"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
